let cpTestMode = false, cpTestQueue = [], cpTestIdx = 0, cpTestScore = 0;

function renderCompare() {
  return `
  <div class="panel" style="margin-bottom:14px">
    <div style="font-size:.85rem;color:var(--muted);margin-bottom:10px">🆚 Những chữ Hán dễ nhìn nhầm hoặc đồng âm — đặt cạnh nhau để so sánh và ghi nhớ điểm khác biệt.</div>
    <button class="btn btn-primary" onclick="cpStartTest()">🧠 Kiểm tra nhanh tất cả nhóm</button>
  </div>
  <div id="cp-area">${cpRenderList()}</div>`;
}
function bindCompare() {}

function cpRenderList() {
  const appHz = new Set(WORDS.map(w => w.hz));
  // Bản đồ tra nhanh chữ Hán -> Hán Việt (dùng lại dữ liệu Hán Việt AI đã sinh cho vốn từ của bài học,
  // vì CONFUSE_GROUPS là danh sách chữ tĩnh, tự thân không có sẵn trường hanviet).
  const hvMap = {};
  WORDS.forEach(w => { if (w.hanviet && !hvMap[w.hz]) hvMap[w.hz] = w.hanviet; });
  return CONFUSE_GROUPS.map(g => {
    const itemsHtml = g.chars.map((c,i) => `
      ${i>0?'<span class="confuse-vs">vs</span>':''}
      <div class="confuse-item${appHz.has(c.hz)?' in-vocab':''}">
        <div class="confuse-hz" onclick="speak('${c.hz}')">${c.hz}</div>
        <div class="confuse-py">${c.py}</div>
        ${showHanViet && hvMap[c.hz] ? `<div class="confuse-hv">${hvMap[c.hz]}</div>` : ''}
        <div class="confuse-vi">${c.vi}</div>
        ${appHz.has(c.hz)?'<div class="confuse-badge">✓ trong vốn từ</div>':''}
      </div>`).join('');
    return `<div class="confuse-card">
      <div class="confuse-row">${itemsHtml}</div>
      <div class="confuse-tip">💡 ${g.tip}</div>
    </div>`;
  }).join('');
}

function cpStartTest() {
  cpTestMode = true; cpTestScore = 0; cpTestIdx = 0;
  cpTestQueue = shuffle(CONFUSE_GROUPS.slice());
  cpRenderTestQ();
}

function cpRenderTestQ() {
  const area = document.getElementById('cp-area');
  if (cpTestIdx >= cpTestQueue.length) {
    area.innerHTML = `<div class="panel exam-result">
      <div class="exam-score">${cpTestScore}/${cpTestQueue.length}</div>
      <div class="exam-rank">${qzRank(cpTestScore/cpTestQueue.length)}</div>
      <button class="btn btn-primary" onclick="cpStartTest()">Làm lại</button>
      <button class="btn" onclick="cpExitTest()">Xem danh sách</button>
    </div>`;
    return;
  }
  const g = cpTestQueue[cpTestIdx];
  const target = g.chars[Math.floor(Math.random()*g.chars.length)];
  const opts = shuffle(g.chars.slice());
  const optHtml = opts.map(o => `<button class="confuse-test-opt" onclick="cpPick(this,'${o.hz}','${target.hz}')">${o.hz}</button>`).join('');
  area.innerHTML = `<div class="panel">
    <div style="font-size:.75rem;color:var(--muted);margin-bottom:10px">${cpTestIdx+1}/${cpTestQueue.length} · Chọn đúng chữ Hán</div>
    <div style="text-align:center;font-size:1.05rem;font-weight:700;margin-bottom:6px">${target.vi}</div>
    <div style="text-align:center;font-size:.85rem;color:var(--muted);font-style:italic;margin-bottom:14px">${target.py}</div>
    <div style="display:flex;justify-content:center;gap:12px;flex-wrap:wrap">${optHtml}</div>
    <div style="margin-top:14px;text-align:center"><button class="btn" onclick="cpExitTest()">✕ Thoát kiểm tra</button></div>
  </div>`;
}

function cpPick(btn, hz, correctHz) {
  document.querySelectorAll('.confuse-test-opt').forEach(b => b.style.pointerEvents = 'none');
  const isCorrect = hz === correctHz;
  if (isCorrect) { btn.classList.add('correct'); cpTestScore++; }
  else {
    btn.classList.add('wrong');
    document.querySelectorAll('.confuse-test-opt').forEach(b => { if (b.textContent === correctHz) b.classList.add('correct'); });
  }
  speak(correctHz);
  setTimeout(() => { cpTestIdx++; cpRenderTestQ(); }, 1200);
}

function cpExitTest() {
  cpTestMode = false;
  document.getElementById('cp-area').innerHTML = cpRenderList();
}

// ════════════════════════════════════════════════════
// HSK4 PROGRESS TRACKER
// ════════════════════════════════════════════════════
// QUAN TRỌNG: KHÔNG dùng danh sách HSK_OFFICIAL viết cứng trong code JS nữa (danh sách đó chỉ là
// ước lượng, không khớp 100% với dữ liệu thật). Thay vào đó, lấy đúng dữ liệu HSK1/HSK2/HSK3/HSK4
// mà chính người dùng đã đẩy lên database ở các "bài" đặc biệt 32/33/34/35 (đúng như cách trang
// "🎯 Luyện thi HSK" ở Trang chủ đang đếm số từ) — coi đây là chuẩn để tính toán.
const HSK_LEVEL_LESSON = { 1: 32, 2: 33, 3: 34, 4: 35 };

function renderHSK() {
  return `<div class="panel">
    <div id="hsk-area" style="text-align:center;color:var(--muted);padding:24px 0;">Đang tải dữ liệu HSK1-4 từ database...</div>
  </div>`;
}

async function bindHSK() {
  const area = document.getElementById('hsk-area');
  if (!area) return;
  try {
    const lessons = Object.values(HSK_LEVEL_LESSON).join(',');
    const res = await fetch('/api/vocab?lessons=' + lessons, { headers: authHeaders() });
    const data = await res.json();
    if (!data.ok) { area.textContent = data.error || 'Không tải được dữ liệu HSK.'; return; }

    const lessonToLevel = {};
    Object.entries(HSK_LEVEL_LESSON).forEach(([lvl, l]) => { lessonToLevel[l] = Number(lvl); });
    const byLevel = { 1: [], 2: [], 3: [], 4: [] };
    for (const w of data.vocab) {
      const lvl = lessonToLevel[w.l];
      if (lvl) byLevel[lvl].push(w);
    }

    // V70 (Task 2 audit — hợp nhất FSRS): "đã thuộc" giờ lấy THẬT từ fsrs_cards (state=Review) qua
    // /api/study/known-by-lesson — thay cho "progress.srs[hz].step>=3" cục bộ đã bị xoá. Khách
    // (chưa đăng nhập) không có tài khoản FSRS nên luôn hiện 0/tổng — đúng thực tế, không giả vờ.
    const knownByLesson = isLoggedIn()
      ? await fetch('/api/study/known-by-lesson?lessons=' + Object.values(HSK_LEVEL_LESSON).join(','), { headers: authHeaders() })
          .then(r => r.json()).then(d => (d.ok && d.known) || {}).catch(() => ({}))
      : {};
    if (currentTab !== 'hsk') return; // user đã rời tab trong lúc chờ tải
    const cov = {};
    let totalWords = 0, totalKnown = 0;
    [1, 2, 3, 4].forEach(lvl => {
      const list = byLevel[lvl];
      const lessonNum = HSK_LEVEL_LESSON[lvl];
      const known = Math.min(knownByLesson[lessonNum] || 0, list.length);
      cov[lvl] = { total: list.length, known };
      totalWords += list.length; totalKnown += known;
    });

    if (totalWords === 0) {
      area.innerHTML = `⚠️ Chưa có dữ liệu HSK1-4 trong database (bài 32-35 đang trống). Vào Quản trị → Từ vựng để nhập từ HSK cho các bài này.`;
      return;
    }

    const knownPct = Math.round(totalKnown / totalWords * 100);
    const levelRows = [1, 2, 3, 4].map(lvl => {
      const c = cov[lvl];
      const p = c.total ? Math.round(c.known / c.total * 100) : 0;
      return `<div class="hsk-level-row">
        <div class="hsk-level-label">
          <span class="lv">HSK ${lvl}</span>
          <span class="ct">${c.known}/${c.total} từ đã thuộc (${p}%)</span>
        </div>
        <div class="prog-bar"><div class="prog-fill" style="width:${p}%;background:${lessonColor(6 + lvl)}"></div></div>
      </div>`;
    }).join('');

    area.outerHTML = `<div id="hsk-area">
      <div class="hsk-hero">
        <div class="hsk-hero-num">${totalKnown}/${totalWords}</div>
        <div class="hsk-hero-sub">từ đã thuộc trên tổng số từ HSK1-4 trong database (${knownPct}%)</div>
        <div class="hsk-bigbar"><div class="hsk-bigbar-fill" style="width:${knownPct}%"></div></div>
      </div>
    </div>
    <div class="panel">
      <div class="panel-title">Chi tiết theo cấp độ</div>
      ${levelRows}
      <div class="hsk-note">
        📌 Danh sách từ HSK1-4 lấy TRỰC TIẾP từ dữ liệu bạn đã nhập vào database (bài 32=HSK1, 33=HSK2, 34=HSK3, 35=HSK4) — đúng số liệu đang hiện ở mục "🎯 Luyện thi HSK" trên Trang chủ. "Đã thuộc" là từ đã vượt mốc ôn ≥1 ngày trong SRS.
      </div>
    </div>`;
  } catch (e) {
    area.textContent = 'Không kết nối được máy chủ: ' + e.message;
  }
}

async function loadHanVietProgress() {
  const area = document.getElementById('hanviet-progress-area');
  if (!area) return;
  try {
    const res = await fetch('/api/admin/hanviet/progress', { headers: authHeaders() });
    const data = await res.json();
    if (!data.ok) { area.textContent = data.error || 'Không tải được dữ liệu.'; return; }
    const pct = data.total ? Math.round(data.done / data.total * 100) : 0;
    area.innerHTML = `
      <div style="display:flex;justify-content:space-between;font-size:.85rem;font-weight:700;margin-bottom:6px;">
        <span>${data.done} / ${data.total} từ đã có nghĩa Hán Việt</span>
        <span style="color:var(--active-dark)">${pct}%</span>
      </div>
      <div class="prog-bar"><div class="prog-fill" style="width:${pct}%;background:var(--active);"></div></div>`;
  } catch (e) {
    area.textContent = 'Không kết nối được máy chủ: ' + e.message;
  }
}
async function triggerHanVietGeneration() {
  const btn = document.getElementById('gen-hanviet-btn');
  const resultEl = document.getElementById('gen-hanviet-result');
  btn.disabled = true;
  btn.textContent = '⏳ Đang chạy... (có thể mất tới 50 giây, đừng rời trang)';
  resultEl.textContent = '';

    const res = await fetch('/api/admin/generate-hanviet', { method: 'POST', headers: authHeaders() });

    <b>Chi tiết lỗi:</b>

// Sau khi admin chạy sinh Hán Việt xong, các bài đã tải về máy (WORDS) vẫn đang giữ dữ liệu CŨ
// (chưa có hanviet) vì ensureVocabLoaded() bỏ qua từ đã có trong WORDS theo key hz+l. Hàm này tải
// lại đúng các bài đã tải và GHI ĐÈ trường hanviet vào những mục đã có sẵn trong WORDS, để admin
// thấy kết quả ngay mà không cần tải lại trang.
async function refreshVocabHanviet() {
  if (!loadedLessonNumbers.size) return;
  const url = (isGuest || !authToken)
    ? '/api/vocab/public?lessons=' + [...loadedLessonNumbers].join(',')
    : '/api/vocab?lessons=' + [...loadedLessonNumbers].join(',');
  try {
    const res = await fetch(url, (isGuest || !authToken) ? {} : { headers: authHeaders() });
    const data = await res.json();
    if (data.ok && Array.isArray(data.vocab)) {
      const byKey = new Map(data.vocab.map(w => [w.hz + '-' + w.l, w]));
      WORDS.forEach(w => {
        const fresh = byKey.get(w.hz + '-' + w.l);
        if (fresh && fresh.hanviet) w.hanviet = fresh.hanviet;
      });
    }
  } catch {
    // Không tải lại được thì thôi, dữ liệu vẫn đã lưu đúng trong DB, chỉ là chưa hiện ngay trên máy này
  }
}
async function loadVocabAdminList() {
  const area = document.getElementById('vocab-list-area');
  if (!area) return;
  try {
    const res = await fetch('/api/vocab/counts', { headers: authHeaders() });
    const data = await res.json();
    if (!data.ok) { area.textContent = data.error || 'Không tải được danh sách.'; return; }
    const entries = Object.entries(data.counts)
      .map(([l, c]) => [parseInt(l, 10), c])
      .filter(([l, c]) => c > 0)
      .sort((a, b) => a[0] - b[0]);
    if (entries.length === 0) {
      area.innerHTML = `<div style="color:var(--muted);text-align:center;padding:14px 0;">Chưa có bài nào được thêm qua Excel/thủ công.</div>`;
      return;
    }
    area.innerHTML = entries.map(([l, c]) => `
      <div style="display:flex;align-items:center;justify-content:space-between;padding:9px 2px;border-bottom:1px solid var(--border);">
        <span style="font-weight:700;">Bài ${l} <span style="color:var(--muted);font-weight:600;font-size:.82rem;">(${c} từ)</span></span>
        <button class="btn btn-sm" style="background:#fdecea;color:#c0392b;" onclick="deleteLessonVocab(${l})">🗑️ Xoá</button>
      </div>`).join('');
  } catch (e) {
    area.textContent = 'Không kết nối được máy chủ: ' + e.message;
  }
}
async function deleteLessonVocab(l) {
  if (!confirm(`Xoá toàn bộ từ vựng của Bài ${l}? Không thể hoàn tác.`)) return;
  try {
    const res = await fetch('/api/admin/vocab/delete-lesson', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', ...authHeaders() },
      body: JSON.stringify({ l }),
    });
    const data = await res.json();
    if (!data.ok) { alert(data.error || 'Có lỗi xảy ra'); return; }
    alert(`Đã xoá ${data.removed} từ của Bài ${l}. Tải lại trang để cập nhật màn hình chọn bài.`);
    loadVocabAdminList();
  } catch (e) {
    alert('Không kết nối được máy chủ: ' + e.message);
  }
}
async function addVocabManual() {
  const resultEl = document.getElementById('vocab-manual-result');
  const hz = document.getElementById('vocab-manual-hz').value.trim();
  const py = document.getElementById('vocab-manual-py').value.trim();
  const vi = document.getElementById('vocab-manual-vi').value.trim();
  const l = parseInt(document.getElementById('vocab-manual-l').value, 10);
  const tag = document.getElementById('vocab-manual-lyhop').checked ? 'ly_hop' : null;
  const overwrite = document.getElementById('vocab-manual-overwrite').checked;
  if (!hz || !vi || !Number.isFinite(l) || l < 1) {
    resultEl.textContent = 'Vui lòng nhập đủ Chữ Hán, Nghĩa và Số bài (số nguyên ≥ 1).';
    return;
  }
  resultEl.textContent = 'Đang thêm...';
  try {
    const res = await fetch('/api/admin/vocab/import', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', ...authHeaders() },
      body: JSON.stringify({ words: [{ hz, py, vi, l, tag }], overwrite }),
    });
    const data = await res.json();
    if (!data.ok) { resultEl.textContent = '❌ ' + (data.error || 'Có lỗi xảy ra'); return; }
    if (data.added > 0) {
      resultEl.innerHTML = `✅ Đã thêm từ <b>${hz}</b>. <span style="color:var(--l9a);">Tải lại trang để dùng ngay.</span>`;
      document.getElementById('vocab-manual-hz').value = '';
      document.getElementById('vocab-manual-py').value = '';
      document.getElementById('vocab-manual-vi').value = '';
      document.getElementById('vocab-manual-l').value = '';
      document.getElementById('vocab-manual-lyhop').checked = false;
      loadVocabAdminList();
    } else if (data.updated > 0) {
      resultEl.innerHTML = `✅ Đã cập nhật lại từ <b>${hz}</b> (bài ${l}). <span style="color:var(--l9a);">Tải lại trang để dùng ngay.</span>`;
    } else {
      resultEl.textContent = `⚠️ Từ "${hz}" ở bài ${l} đã tồn tại rồi. Tick ô "Ghi đè" nếu muốn cập nhật lại pinyin/nghĩa.`;
    }
  } catch (e) {
    resultEl.textContent = '❌ Không kết nối được máy chủ: ' + e.message;
  }
}
// Chuẩn hoá cột "tag" khi đọc file Excel — chấp nhận nhiều cách viết khác nhau (tiếng Việt có dấu,
// không dấu, hoặc chữ Hán) đều quy về 1 giá trị chuẩn duy nhất 'ly_hop' để web hiểu và hiển thị đúng.
function normalizeVocabTag(raw) {
  const s = String(raw || '').trim().toLowerCase();
  if (!s) return null;
  if (['ly_hop', 'lyhop', 'ly hợp', 'ly hop', 'động từ ly hợp', 'dong tu ly hop', '离合词', '离合动词']
      .some(x => s === x || s.includes('ly hợp') || s.includes('ly hop') || s.includes('离合'))) {
    return 'ly_hop';
  }
  return s; // giữ nguyên các loại tag khác trong tương lai, không chỉ riêng ly hợp
}
function downloadVocabTemplate() {
  const ws = XLSX.utils.json_to_sheet([
    { hz: '你好', py: 'nǐ hǎo', vi: 'xin chào', l: 1, tag: '' },
    { hz: '谢谢', py: 'xièxie', vi: 'cảm ơn', l: 1, tag: '' },
    { hz: '睡觉', py: 'shuìjiào', vi: 'ngủ', l: 1, tag: 'ly_hop' },
  ]);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Từ vựng');
  XLSX.writeFile(wb, 'mau-tu-vung.xlsx');
}
async function uploadVocabExcel() {
  const input = document.getElementById('vocab-file-input');
  const resultEl = document.getElementById('vocab-import-result');
  const file = input.files && input.files[0];
  if (!file) { resultEl.textContent = 'Chưa chọn file.'; return; }
  resultEl.textContent = 'Đang đọc file...';
  try {
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type: 'array' });
    const sheet = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(sheet, { defval: '' });
    if (!rows.length) { resultEl.textContent = 'File không có dữ liệu.'; return; }
    const words = rows.map(r => ({
      hz: String(r.hz ?? r['Chữ Hán'] ?? '').trim(),
      py: String(r.py ?? r['Pinyin'] ?? '').trim(),
      vi: String(r.vi ?? r['Nghĩa'] ?? '').trim(),
      l: parseInt(r.l ?? r['Bài'], 10),
      tag: normalizeVocabTag(r.tag ?? r['Loại từ'] ?? r['Nhãn'] ?? ''),
    }));
    resultEl.textContent = `Đang nhập ${words.length} dòng...`;
    const overwrite = document.getElementById('vocab-excel-overwrite').checked;
    const res = await fetch('/api/admin/vocab/import', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', ...authHeaders() },
      body: JSON.stringify({ words, overwrite }),
    });
    const data = await res.json();
    if (!data.ok) { resultEl.textContent = '❌ ' + (data.error || 'Có lỗi xảy ra'); return; }
    resultEl.innerHTML = `✅ Đã thêm <b>${data.added}</b> từ mới, cập nhật <b>${data.updated}</b> từ trùng. Bỏ qua ${data.skipped} từ trùng (chưa tick ghi đè), ${data.invalid} dòng thiếu dữ liệu.<br>Tổng số từ đã thêm qua Excel/thủ công: <b>${data.total}</b>.<br><span style="color:var(--l9a);">Tải lại trang để dùng ngay các từ mới.</span>`;
    loadVocabAdminList();

    resultEl.textContent = '❌ Không đọc được file: ' + e.message;
  }
}

function shuffle(arr) {
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}

// Số từ theo từng bài lấy từ server (payload rất nhỏ — chỉ vài số), dùng để hiện số từ ở màn
// chọn Quyển/level mà KHÔNG cần tải cả nội dung từ vựng. Bài 1-30 (781 từ có sẵn) đã nhúng
// sẵn trong app nên không cần tính qua server.
let vocabCounts = {};
async function loadVocabCounts() {
  try {
    const res = await fetch('/api/vocab/counts');
    const data = await res.json();
    if (data.ok && data.counts) vocabCounts = data.counts;
  } catch {
    // Không tải được thì màn chọn Quyển/level tạm không hiện số từ, không chặn app
  }
}

// Bài nào đã tải nội dung từ vựng về máy rồi (tránh tải lại lần 2 khi chọn lại)
let loadedLessonNumbers = new Set();

// Tải về ĐÚNG phần từ vựng cần cho các Quyển/level đang chọn (thay vì tải hết mọi thứ).
// Toàn bộ từ vựng giờ nạp từ database, kể cả Quyển 1/2 — khách (chưa đăng nhập) dùng API công khai
// riêng, server tự giới hạn chỉ được Bài 1-5 (giới hạn dùng thử của khách).
async function ensureVocabLoaded(bookIds) {
  const needed = [];
  for (const id of bookIds) {
    let b = BOOKS.find(x => x.id === id);
    // Bài tự nhận diện (id = 2000+bài) có thể chưa kịp gộp vào BOOKS nếu vocabCounts còn đang tải song song —
    // suy ra trực tiếp từ id để không phải chờ mergeDiscoveredLessonsIntoBooks() chạy trước.
    if (!b && id >= 2000) b = { from: id - 2000, to: id - 2000 };
    if (!b) continue;
    for (let l = b.from; l <= b.to; l++) {
      if (!loadedLessonNumbers.has(l)) needed.push(l);
    }
  }
  if (needed.length === 0) return;
  const url = (isGuest || !authToken)
    ? '/api/vocab/public?lessons=' + needed.join(',')
    : '/api/vocab?lessons=' + needed.join(',');
  try {
    const res = await fetch(url, (isGuest || !authToken) ? {} : { headers: authHeaders() });
    const data = await res.json();
    if (data.ok && Array.isArray(data.vocab)) {
      const seen = new Set(WORDS.map(w => w.hz + '-' + w.l));
      for (const w of data.vocab) {
        const key = w.hz + '-' + w.l;
        if (seen.has(key)) continue;
        seen.add(key);
        WORDS.push(w);
      }
      _bookCountCache.len = -1; // WORDS vừa đổi -> tính lại cache số từ theo Quyển
    }
    needed.forEach(l => loadedLessonNumbers.add(l));
  } catch {
    // Không tải được thì các bài đó tạm hiện thiếu từ, không chặn app — sẽ thử lại khi chọn lại
  }
}

// Nếu máy đã có cache tiến độ từ lần trước (trường hợp phổ biến nhất: mở lại app đã đăng nhập
// rồi) hoặc đang ở chế độ khách, bootAuth() sẽ khôi phục selectedBookIds NGAY LẬP TỨC (đồng bộ,
// trước khi có await nào chạy) — nên có thể bắt đầu tải từ vựng SONG SONG với việc xác thực lại
// token với server, thay vì đợi round-trip xác thực xong mới bắt đầu tải như trước (tốn thêm hẳn
// 1 lượt đi-về mạng mỗi lần mở app). Chỉ trường hợp lần đầu đăng nhập trên máy này (chưa có cache)
// mới cần đợi bootAuth xong để biết đúng Quyển/bài đã chọn trước khi tải.
const hasCachedProgress = isGuest || (authToken && authUsername && !!localStorage.getItem('progressCache_' + authUsername));
const bootPromise = bootAuth();
const vocabLoadPromise = hasCachedProgress
  ? Promise.all([loadVocabCounts(), ensureVocabLoaded(selectedBookIds)])
  : bootPromise.then(() => Promise.all([loadVocabCounts(), ensureVocabLoaded(selectedBookIds)]));

bootPromise.then(async () => {
  await vocabLoadPromise;
  mergeDiscoveredLessonsIntoBooks(); // tự nhận diện các bài mới chưa có trong danh mục, thêm vào mục chọn
  updateStreak();
  render();
  loadHanziParts().then(() => render()); // tải chiết tự bộ thủ ngầm phía sau, không chặn hiển thị ban đầu
});

    wrap.remove();

})();
