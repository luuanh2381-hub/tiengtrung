<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>學中文 · Học Tiếng Trung</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  /* ══════════════════════════════════════════════════════════
     DESIGN TOKENS — hệ thống thiết kế mới (lấy cảm hứng Duolingo)
     Giữ nguyên tên biến --active/--correct/--wrong/--radius/--shadow/--paper/--ink/--muted/--border
     vì rất nhiều nơi trong HTML (do JS sinh ra) đang dùng var(...) này — chỉ đổi GIÁ TRỊ, không đổi TÊN,
     nên toàn bộ giao diện tự động cập nhật mà không cần sửa JS.
     ══════════════════════════════════════════════════════════ */
  :root {
    --font: 'Nunito', 'Segoe UI', system-ui, sans-serif;

    --ink:    #3c3c3c;
    --paper:  #f7f7f5;
    --card:   #ffffff;
    --muted:  #767676;
    --border: #e5e5e5;

    --radius-sm: 12px;
    --radius:    18px;
    --radius-lg: 20px;
    --shadow:    0 3px 8px rgba(0,0,0,.06), 0 10px 24px rgba(0,0,0,.10);
    --shadow-md: 0 6px 14px rgba(0,0,0,.08), 0 18px 38px rgba(0,0,0,.14);
    --shadow-btn:0 4px 0 rgba(0,0,0,.15);

    /* lesson palette — giữ nguyên, đã đẹp và có chủ đích riêng theo từng bài */
    --l7a:#e07b39; --l7b:#fff3eb; --l7c:#fde8d3;
    --l8a:#3a8c5c; --l8b:#eaf6ef; --l8c:#c8ecd7;
    --l9a:#5465d4; --l9b:#edf0ff; --l9c:#ccd2f7;
    --l10a:#c0435e;--l10b:#fff0f3;--l10c:#f7c2cc;
    --l11a:#8b5cf6;--l11b:#f3eeff;--l11c:#ddccfb;
    --l12a:#0f9b8e;--l12b:#e8f9f6;--l12c:#bfeee7;
    --l13a:#b8860b;--l13b:#fdf6e3;--l13c:#f3e2ad;
    --l1a:#c0392b; --l1b:#fdecea; --l1c:#f8cfc9;
    --l2a:#d35400; --l2b:#fdf0e4; --l2c:#f9d9b8;
    --l3a:#c99a06; --l3b:#fef8e7; --l3c:#f2e2a8;
    --l4a:#27ae60; --l4b:#eafaf1; --l4c:#c8f0da;
    --l5a:#16a085; --l5b:#e8f8f5; --l5c:#c3ecdf;
    --l6a:#2980b9; --l6b:#eaf4fb; --l6c:#c6e3f5;
    --l14a:#7f8c8d;--l14b:#f2f4f4;--l14c:#dbdfdf;
    --l15a:#34495e;--l15b:#eaedf0;--l15c:#c7cdd3;

    /* Màu chủ đạo — xanh lá Duolingo */
    --active:      #58CC02;
    --active-dark: #46A302;
    --active-bg:   #eefbe3;
    --correct:     #58CC02;
    --ok:          #58CC02;
    --wrong:       #FF4B4B;
    --fail:        #FF4B4B;
  }

  /* ── DARK MODE ─────────────────────────────────────────── */
  html[data-theme="dark"] {
    --ink:    #eef1f2;
    --paper:  #131c22;
    --card:   #1e2a31;
    --muted:  #9aa7ad;
    --border: #2c3941;
    --shadow:    0 3px 8px rgba(0,0,0,.3), 0 10px 26px rgba(0,0,0,.4);
    --shadow-md: 0 6px 16px rgba(0,0,0,.4), 0 20px 42px rgba(0,0,0,.5);
    --active-bg: rgba(88,204,2,.14);
  }
  html[data-theme="dark"] .fc-front,
  html[data-theme="dark"] .fc-back { background: var(--card); }
  html[data-theme="dark"] .book-card,
  html[data-theme="dark"] .quiz-type-btn,
  html[data-theme="dark"] #topbar,
  html[data-theme="dark"] #nav,
  html[data-theme="dark"] .panel,
  html[data-theme="dark"] .auth-box { background: var(--card); }
  html[data-theme="dark"] input,
  html[data-theme="dark"] select,
  html[data-theme="dark"] textarea { background: var(--card); color: var(--ink); }

  /* ── RESET & BASE ──────────────────────────────────────── */
  *{box-sizing:border-box;margin:0;padding:0;}
  html{-webkit-tap-highlight-color:transparent;}
  body{font-family:var(--font);background:var(--paper);background-image:radial-gradient(circle at 15% 0%, rgba(88,204,2,.06), transparent 45%),radial-gradient(circle at 100% 20%, rgba(88,204,2,.05), transparent 40%);background-attachment:fixed;color:var(--ink);min-height:100vh;overflow-x:hidden;transition:background .25s ease,color .25s ease;-webkit-font-smoothing:antialiased;}
  input,select,textarea{font-family:var(--font);}
  button{font-family:var(--font);}

  /* ── ANIMATIONS ────────────────────────────────────────── */
  @keyframes fadeSlideIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
  @keyframes popIn{0%{transform:scale(.85);opacity:0;}70%{transform:scale(1.04);}100%{transform:scale(1);opacity:1;}}
  @keyframes shakeX{10%,90%{transform:translateX(-2px);}20%,80%{transform:translateX(4px);}30%,50%,70%{transform:translateX(-7px);}40%,60%{transform:translateX(7px);}}
  @keyframes pulseGlow{0%,100%{transform:scale(1);}50%{transform:scale(1.08);}}
  #content{animation:fadeSlideIn .35s cubic-bezier(.2,.8,.3,1);}
  .anim-pop{animation:popIn .35s cubic-bezier(.2,.8,.3,1);}
  .anim-shake{animation:shakeX .4s;}

  /* Hiệu ứng "lún xuống" khi bấm — cảm giác nút bấm vật lý kiểu Duolingo */
  button{-webkit-tap-highlight-color:transparent;}
  .btn,.lbtn,.book-card,.fc-btn,.auth-submit,.quiz-opt,.listen-opt,.confuse-test-opt,#nav button,.quiz-type-btn{
    transition:transform .1s ease, box-shadow .1s ease, opacity .15s ease, background .15s ease, border-color .15s ease;
  }
  .btn:active,.lbtn:active,.book-card:active,.fc-btn:active,.auth-submit:active,
  .quiz-opt:not(.correct):not(.wrong):active,.listen-opt:not(.correct):not(.wrong):active,
  .confuse-test-opt:not(.correct):not(.wrong):active,.quiz-type-btn:active{
    transform:scale(.96);
  }

  /* ── APP HEADER (topbar + nav gộp chung 1 khối dính cố định) ─────────────
     Trước đây chỉ #topbar có position:sticky, còn #nav nằm ngoài nên khi cuộn
     trang, #nav bị trôi/lẫn dưới #topbar gây cảm giác thanh công cụ "di chuyển".
     Gộp cả 2 vào 1 wrapper dính cố định chung để chúng luôn đứng yên cùng nhau. */
  #app-header{position:sticky;top:0;z-index:100;}

  /* ── TOPBAR ────────────────────────────────────────────── */
  #topbar{background:var(--card);border-bottom:1px solid var(--border);display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:6px 12px;box-shadow:0 1px 8px rgba(0,0,0,.05);}
  #topbar h1{font-size:.88rem;font-weight:900;letter-spacing:-.5px;margin-right:2px;}
  #streak-badge{background:var(--l7c);padding:3px 9px;border-radius:16px;font-size:.7rem;font-weight:800;color:var(--l7a);animation:popIn .4s cubic-bezier(.2,.8,.3,1);}
  .pinyin-toggle{background:var(--active-bg);color:var(--active-dark);border:none;padding:4px 10px;border-radius:16px;font-size:.7rem;font-weight:800;cursor:pointer;}
  .speed-control{display:flex;align-items:center;gap:4px;background:var(--paper);border-radius:16px;padding:3px 9px;}
  .speed-control label{font-size:.62rem;font-weight:700;color:var(--muted);}
  .speed-control input[type=range]{width:46px;accent-color:var(--active);cursor:pointer;}
  .speed-val{font-size:.62rem;font-weight:700;color:var(--active-dark);min-width:22px;}
  .theme-toggle{background:var(--paper);border:1.5px solid var(--border);color:var(--ink);border-radius:16px;padding:4px 9px;font-size:.78rem;cursor:pointer;line-height:1;}

  /* ── NAV TABS ──────────────────────────────────────────── */
  #nav{display:flex;overflow-x:auto;gap:4px;padding:6px 12px;background:var(--card);border-bottom:1px solid var(--border);scrollbar-width:none;}
  #nav::-webkit-scrollbar{display:none;}
  #nav button{flex-shrink:0;padding:6px 12px;border:none;background:transparent;font-size:.74rem;font-weight:800;color:var(--muted);border-radius:12px;cursor:pointer;}
  #nav button.active{color:var(--active-dark);background:var(--active-bg);}

  /* ── MAIN CONTENT ──────────────────────────────────────── */
  #content{padding:16px;max-width:720px;margin:0 auto;}

  /* ── CARDS / PANELS ────────────────────────────────────── */
  .panel{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-bottom:16px;border:1px solid rgba(255,255,255,.6);transition:transform .2s cubic-bezier(.2,.8,.3,1), box-shadow .2s ease;}
  html[data-theme="dark"] .panel{border-color:rgba(255,255,255,.04);}
  #auth-gate{position:fixed;inset:0;background:var(--paper);z-index:999;display:flex;align-items:center;justify-content:center;padding:20px;}
  .auth-box{background:var(--card);border-radius:var(--radius-lg);box-shadow:var(--shadow-md);padding:30px 26px;width:100%;max-width:360px;animation:popIn .35s cubic-bezier(.2,.8,.3,1);}
  .auth-title{font-size:1.35rem;font-weight:900;text-align:center;margin-bottom:4px;}
  .auth-sub{font-size:.8rem;color:var(--muted);text-align:center;margin-bottom:20px;}
  .auth-tabs{display:flex;gap:6px;margin-bottom:18px;background:var(--paper);border-radius:12px;padding:4px;}
  .auth-tab{flex:1;padding:9px;border:none;background:none;border-radius:9px;font-weight:800;font-size:.85rem;color:var(--muted);cursor:pointer;}
  .auth-tab.active{background:var(--active);color:#fff;}
  .auth-field{margin-bottom:12px;}
  .auth-field label{display:block;font-size:.75rem;font-weight:700;color:var(--muted);margin-bottom:5px;}
  .auth-field input{width:100%;padding:11px 13px;border:1.5px solid var(--border);border-radius:12px;font-size:.95rem;box-sizing:border-box;background:var(--card);color:var(--ink);}
  .auth-field input:focus{outline:none;border-color:var(--active);}
  .auth-error{background:#fdecea;color:#c0392b;font-size:.8rem;font-weight:600;padding:9px 11px;border-radius:10px;margin-bottom:12px;display:none;}
  .auth-error.show{display:block;}
  .auth-submit{width:100%;padding:12px;border:none;border-radius:14px;background:var(--active);color:#fff;font-weight:800;font-size:.95rem;cursor:pointer;margin-top:4px;box-shadow:0 4px 0 var(--active-dark);}
  .auth-submit:active{transform:translateY(2px);box-shadow:0 2px 0 var(--active-dark);}
  .auth-submit:disabled{opacity:.6;cursor:default;box-shadow:none;transform:none;}
  .auth-guest{width:100%;padding:9px;border:none;background:none;color:var(--muted);font-size:.78rem;font-weight:600;cursor:pointer;margin-top:10px;text-decoration:underline;}
  #user-badge{background:var(--l11c);padding:3px 9px;border-radius:16px;font-size:.7rem;font-weight:800;color:var(--l11a);cursor:pointer;border:none;}
  .sync-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--active);margin-right:4px;vertical-align:middle;}
  .sync-dot.offline{background:var(--wrong);}
  .panel-title{font-size:.75rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:14px;}

  /* ── LESSON FILTER ─────────────────────────────────────── */
  #lesson-filter{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;}
  .lbtn{padding:7px 15px;border-radius:20px;border:2px solid;font-size:.82rem;font-weight:800;cursor:pointer;}

  /* ── Bảng chọn Quyển/nhóm từ vựng ─────────────────────── */
  .book-group{margin-bottom:14px;}
  .book-group-label{font-size:.72rem;color:var(--muted);font-weight:700;margin-bottom:8px;letter-spacing:.02em;}
  .book-grid{display:flex;flex-wrap:wrap;gap:10px;}
  .book-card{position:relative;flex:1 1 100px;max-width:170px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:14px 10px;border-radius:var(--radius-sm);border:none;background:var(--card);cursor:pointer;box-shadow:0 4px 10px rgba(0,0,0,.08);}
  .book-card:active{transform:translateY(2px);box-shadow:0 1px 4px rgba(0,0,0,.08);}
  .book-card.sel{border-color:var(--active);background:var(--active);box-shadow:0 4px 14px rgba(88,204,2,.3);}
  .book-card.sel .book-card-name{color:#fff;}
  .book-card.sel .book-card-count{color:rgba(255,255,255,.9);}
  .book-card.locked{opacity:.5;}
  .book-card-name{font-weight:800;font-size:.87rem;color:var(--ink);text-align:center;}
  .book-card-count{font-size:.68rem;color:var(--muted);font-weight:700;}
  .book-card-lock{position:absolute;top:6px;right:8px;font-size:.7rem;}
  .lbtn[data-l="0"]{border-color:var(--active);background:var(--active-bg);color:var(--active-dark);}
  .lbtn[data-l="1"]{border-color:var(--l1a);background:var(--l1b);color:var(--l1a);}
  .lbtn[data-l="2"]{border-color:var(--l2a);background:var(--l2b);color:var(--l2a);}
  .lbtn[data-l="3"]{border-color:var(--l3a);background:var(--l3b);color:var(--l3a);}
  .lbtn[data-l="4"]{border-color:var(--l4a);background:var(--l4b);color:var(--l4a);}
  .lbtn[data-l="5"]{border-color:var(--l5a);background:var(--l5b);color:var(--l5a);}
  .lbtn[data-l="6"]{border-color:var(--l6a);background:var(--l6b);color:var(--l6a);}
  .lbtn[data-l="14"]{border-color:var(--l14a);background:var(--l14b);color:var(--l14a);}
  .lbtn[data-l="15"]{border-color:var(--l15a);background:var(--l15b);color:var(--l15a);}
  .lbtn[data-l="7"]{border-color:var(--l7a);background:var(--l7b);color:var(--l7a);}
  .lbtn[data-l="8"]{border-color:var(--l8a);background:var(--l8b);color:var(--l8a);}
  .lbtn[data-l="9"]{border-color:var(--l9a);background:var(--l9b);color:var(--l9a);}
  .lbtn[data-l="10"]{border-color:var(--l10a);background:var(--l10b);color:var(--l10a);}
  .lbtn[data-l="11"]{border-color:var(--l11a);background:var(--l11b);color:var(--l11a);}
  .lbtn[data-l="12"]{border-color:var(--l12a);background:var(--l12b);color:var(--l12a);}
  .lbtn[data-l="13"]{border-color:var(--l13a);background:var(--l13b);color:var(--l13a);}
  .lbtn.sel{color:#fff!important;}
  .lbtn[data-l="0"].sel{background:var(--active);}
  .lbtn[data-l="1"].sel{background:var(--l1a);}
  .lbtn[data-l="2"].sel{background:var(--l2a);}
  .lbtn[data-l="3"].sel{background:var(--l3a);}
  .lbtn[data-l="4"].sel{background:var(--l4a);}
  .lbtn[data-l="5"].sel{background:var(--l5a);}
  .lbtn[data-l="6"].sel{background:var(--l6a);}
  .lbtn[data-l="14"].sel{background:var(--l14a);}
  .lbtn[data-l="15"].sel{background:var(--l15a);}
  .lbtn[data-l="7"].sel{background:var(--l7a);}
  .lbtn[data-l="8"].sel{background:var(--l8a);}
  .lbtn[data-l="9"].sel{background:var(--l9a);}
  .lbtn[data-l="10"].sel{background:var(--l10a);}
  .lbtn[data-l="11"].sel{background:var(--l11a);}
  .lbtn[data-l="12"].sel{background:var(--l12a);}
  .lbtn[data-l="13"].sel{background:var(--l13a);}

  /* ── PROGRESS BARS ─────────────────────────────────────── */
  .prog-row{margin-bottom:10px;}
  .prog-label{display:flex;justify-content:space-between;font-size:.78rem;font-weight:600;margin-bottom:4px;}
  .prog-bar{height:9px;background:var(--border);border-radius:6px;overflow:hidden;}
  .prog-fill{height:100%;border-radius:6px;transition:width .5s cubic-bezier(.2,.8,.3,1);}
  .prog-fill[data-l="1"]{background:var(--l1a);}
  .prog-fill[data-l="2"]{background:var(--l2a);}
  .prog-fill[data-l="3"]{background:var(--l3a);}
  .prog-fill[data-l="4"]{background:var(--l4a);}
  .prog-fill[data-l="5"]{background:var(--l5a);}
  .prog-fill[data-l="6"]{background:var(--l6a);}
  .prog-fill[data-l="14"]{background:var(--l14a);}
  .prog-fill[data-l="15"]{background:var(--l15a);}
  .prog-fill[data-l="7"]{background:var(--l7a);}
  .prog-fill[data-l="8"]{background:var(--l8a);}
  .prog-fill[data-l="9"]{background:var(--l9a);}
  .prog-fill[data-l="10"]{background:var(--l10a);}
  .prog-fill[data-l="11"]{background:var(--l11a);}
  .prog-fill[data-l="12"]{background:var(--l12a);}
  .prog-fill[data-l="13"]{background:var(--l13a);}

  /* ── FLASHCARD ─────────────────────────────────────────── */
  .fc-wrap{perspective:1000px;height:290px;cursor:pointer;margin-bottom:18px;}
  .fc-inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.2,.8,.3,1);}
  .fc-inner.flipped{transform:rotateY(180deg);}
  .fc-front,.fc-back{position:absolute;inset:0;background:var(--card);border-radius:var(--radius-lg);box-shadow:var(--shadow-md), inset 0 1px 0 rgba(255,255,255,.5);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;backface-visibility:hidden;}
  html[data-theme="dark"] .fc-front,html[data-theme="dark"] .fc-back{box-shadow:var(--shadow-md);}
  .fc-back{transform:rotateY(180deg);}
  .fc-hz{font-size:3.2rem;font-weight:900;line-height:1;}
  .fc-hz-back{font-size:2.1rem;font-weight:900;line-height:1;}
  .fc-py{font-size:1rem;color:var(--muted);font-style:italic;}
  .fc-hv{font-size:.85rem;color:var(--active-dark);font-weight:600;}
  .fc-vi{font-size:1.3rem;font-weight:700;text-align:center;padding:0 16px;}
  .fc-lesson-tag{position:absolute;top:12px;right:12px;font-size:.7rem;font-weight:800;padding:4px 10px;border-radius:12px;}
  .fc-hint{font-size:.75rem;color:var(--muted);position:absolute;bottom:12px;}
  .fc-controls{display:flex;gap:10px;justify-content:center;}
  .fc-btn{padding:11px 26px;border:none;border-radius:14px;font-size:.9rem;font-weight:800;cursor:pointer;}
  .btn-ok{background:var(--l8c);color:var(--l8a);box-shadow:0 3px 0 var(--l8a);}
  .btn-ok:active{transform:translateY(2px);box-shadow:0 1px 0 var(--l8a);}
  .btn-fail{background:var(--l10c);color:var(--l10a);box-shadow:0 3px 0 var(--l10a);}
  .btn-fail:active{transform:translateY(2px);box-shadow:0 1px 0 var(--l10a);}
  .btn-sound{background:var(--l9b);color:var(--l9a);padding:9px 15px;}
  .fc-counter{text-align:center;font-size:.78rem;color:var(--muted);margin-bottom:12px;font-weight:700;}
  .fc-parts-wrap{width:100%;max-height:82px;overflow-y:auto;padding:6px 16px;box-sizing:border-box;}
  .fc-parts-wrap.qz-parts{max-height:none;overflow-y:visible;padding:12px 6px 4px;}
  .fc-parts-title{font-size:.66rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px;}
  .fc-parts-row{margin-bottom:7px;font-size:.76rem;line-height:1.55;}
  .fc-parts-char{display:inline-block;font-weight:900;font-size:1.05rem;color:var(--active-dark);margin-right:5px;}
  .fc-parts-comps{color:var(--ink);}
  .fc-parts-chip{display:inline-block;background:var(--paper);border-radius:6px;padding:1px 7px;margin:1px 3px 1px 0;font-weight:700;white-space:nowrap;}
  .fc-parts-note{color:var(--muted);font-style:italic;}

  /* ── HÔM NAY HỌC (FSRS dashboard) ─────────────────────────── */
  .study-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
  .study-stat{background:var(--card);border-radius:var(--radius-sm);padding:16px 12px;text-align:center;box-shadow:0 4px 10px rgba(0,0,0,.06);}
  .study-stat-num{font-size:1.8rem;font-weight:900;line-height:1;}
  .study-stat-label{font-size:.72rem;color:var(--muted);font-weight:700;margin-top:4px;}
  .study-stat.due .study-stat-num{color:var(--l10a);}
  .study-stat.new .study-stat-num{color:var(--active-dark);}
  .study-stat.lesson .study-stat-num{color:var(--l9a);font-size:1.3rem;}
  .study-stat.weak .study-stat-num{color:#c026d3;}
  .study-empty{text-align:center;color:var(--muted);padding:20px 10px;font-size:.9rem;}
  .study-settings-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;font-size:.85rem;border-top:1px solid var(--border);}

  /* ── LISTEN ────────────────────────────────────────────── */

  /* ── TRANSLATE ─────────────────────────────────────────── */
  .trans-vi{font-size:1.05rem;font-weight:700;margin-bottom:10px;line-height:1.5;}

  .btn{padding:12px 24px;border:none;border-radius:14px;font-size:.9rem;font-weight:800;cursor:pointer;}
  .btn-primary{background:var(--active);color:#fff;box-shadow:0 4px 0 var(--active-dark);}

  .confuse-test-opt{padding:16px 8px;border:2px solid var(--border);background:var(--paper);border-radius:var(--radius-sm);font-size:1.6rem;font-weight:900;cursor:pointer;text-align:center;min-width:70px;}

<script>
// ════════════════════════════════════════════════════
// GIAO DIỆN: DARK MODE — hoàn toàn độc lập, không đụng tới logic nghiệp vụ bên dưới
// ════════════════════════════════════════════════════
(function initTheme() {
  const saved = localStorage.getItem('theme');
  if (saved === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
})();
// Áp dụng theme (sáng/tối) vào cả DOM lẫn localStorage (localStorage vẫn giữ để tránh chớp sai
// theme lúc trang vừa tải xong, trước khi kịp lấy progressState.ui.theme từ DB/cache).
function applyTheme(theme) {
  if (theme === 'dark') {
    document.documentElement.setAttribute('data-theme', 'dark');
  } else {
    document.documentElement.removeAttribute('data-theme');
  }
  localStorage.setItem('theme', theme === 'dark' ? 'dark' : 'light');
  const btn = document.getElementById('theme-toggle-btn');
  if (btn) btn.textContent = theme === 'dark' ? '☀️' : '🌙';
}
function toggleTheme() {
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  const newTheme = isDark ? 'light' : 'dark';

  scheduleSync();
}

  if (typeof p.ui.showHanViet !== 'boolean') p.ui.showHanViet = true;
  if (p.ui.theme !== 'dark' && p.ui.theme !== 'light') p.ui.theme = 'light';
  if (typeof p.ui.ttsRate !== 'number' || p.ui.ttsRate < 0.3 || p.ui.ttsRate > 1.0) p.ui.ttsRate = 0.65;
  if (!['漢→Việt', 'Việt→漢', 'Âm→漢'].includes(p.ui.qzType)) p.ui.qzType = '漢→Việt';
  if (!Number.isFinite(p.ui.qzQuestionCount)) p.ui.qzQuestionCount = 30;
  if (!Number.isFinite(p.ui.questionCount)) p.ui.questionCount = 10;
  if (!Number.isFinite(p.ui.dailyReviewLimit) || p.ui.dailyReviewLimit < 1) p.ui.dailyReviewLimit = 50;
  if (!Number.isFinite(p.ui.dailyNewLimit) || p.ui.dailyNewLimit < 0) p.ui.dailyNewLimit = 10;
  if (typeof p.ui.newOnlyAfterDue !== 'boolean') p.ui.newOnlyAfterDue = true;
  if (!Number.isFinite(p.ui.currentLesson)) p.ui.currentLesson = null;
  return p;
}

async function authSubmit() {
  const username = document.getElementById('auth-username').value.trim();
  const password = document.getElementById('auth-password').value;
  const btn = document.getElementById('auth-submit');
  if (!username || !password) { authShowError('Vui lòng nhập đầy đủ thông tin'); return; }
  btn.disabled = true;
  const oldLabel = btn.textContent; btn.textContent = 'Đang xử lý...';
  try {
    const res = await fetch('/api/' + authMode, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password }),
    });
    const data = await res.json();
    if (!data.ok) { authShowError(data.error || 'Có lỗi xảy ra'); return; }
    authToken = data.token; authUsername = data.username; isGuest = false;
    localStorage.setItem('authToken', authToken);
    localStorage.setItem('authUsername', authUsername);
    localStorage.removeItem('authGuest');
    studySession = { id: null, startedAt: 0, lastActivity: 0, cards: 0, correct: 0, wrong: 0 }; // Task 4/5: mỗi tài khoản có phiên học riêng, tránh lẫn phiên cũ
    progressState = data.progress || defaultProgress();
    currentRole = data.role || 'user';
    currentRank = data.rank || null;
    serverStreak = data.streak || 0;
    serverLongestStreak = data.longestStreak || 0;
    serverKnownCount = data.known || 0;
    applyUIState();
    cacheProgressLocally();
    closeAuthGate();
    render();
  } catch (e) {
    authShowError('Không kết nối được máy chủ. Kiểm tra mạng và thử lại.');
  } finally {

// Đồng bộ lên server (gộp các lần lưu liên tiếp trong 700ms để đỡ tốn request)
function scheduleSync() {
  if (isGuest || !authToken) return;
  syncOk = null; updateSyncIndicator();
  clearTimeout(syncTimer);
  syncTimer = setTimeout(async () => {
    try {
      const res = await fetch('/api/progress', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', ...authHeaders() },
        body: JSON.stringify(progressState),
      });
      const data = await res.json();
      syncOk = !!data.ok;
      if (data.rank) { currentRank = data.rank; updateUserBadge(); }
    } catch { syncOk = false; }
    updateSyncIndicator();
  }, 700);
}
function updateSyncIndicator() {
  const badge = document.getElementById('user-badge');
  if (!badge || isGuest || !authUsername) return;
  const dot = syncOk === false ? '<span class="sync-dot offline"></span>' : (syncOk === null ? '' : '<span class="sync-dot"></span>');
  const rankIcon = currentRank ? currentRank.icon + ' ' : '';
  badge.innerHTML = dot + rankIcon + '👤 ' + authUsername + (currentRole === 'superadmin' ? ' 👑🛠️' : currentRole === 'admin' ? ' 🛠️' : '');

// Khởi động: nếu đã đăng nhập trước đó trên máy này, vào thẳng app bằng dữ liệu lưu tạm
// (không phải đợi mạng phản hồi mới cho vào — đây là nguyên nhân gây ra màn hình đăng nhập
// hiện thoáng qua vài giây mỗi lần mở app), rồi âm thầm đồng bộ lại với server phía sau.
async function bootAuth() {
  if (isGuest) {
    progressState = loadGuestProgressLocally();
    applyUIState();
    closeAuthGate();
    return;
  }
  if (authToken && authUsername) {
    const cachedRaw = localStorage.getItem('progressCache_' + authUsername);
    let enteredWithCache = false;
    if (cachedRaw) {
      try {
        progressState = JSON.parse(cachedRaw);
        currentRole = localStorage.getItem('roleCache_' + authUsername) || 'user';
        applyUIState();
        closeAuthGate();
        render();
        enteredWithCache = true;
      } catch {}
    }
    try {
      const res = await fetch('/api/progress', { headers: authHeaders() });
      const data = await res.json();
      if (data.ok) {
        progressState = data.progress || defaultProgress();
        currentRole = data.role || 'user';
        currentRank = data.rank || null;
        // V70 (Task 2 audit): streak/known THẬT từ server (study_sessions/fsrs_cards) — trước đây
        // client bỏ qua 2 trường này và tự tính streak cục bộ bằng SRS cũ đã bị xoá.
        serverStreak = data.streak || 0;
        serverLongestStreak = data.longestStreak || 0;
        serverKnownCount = data.known || 0;
        // Chỉ áp trạng thái tab/lựa chọn nếu đây là lần đầu vào (chưa có cache) — tránh việc
        // đang xem dở 1 tab rồi tự nhảy sang tab khác khi dữ liệu server về chậm hơn 1 chút.
        if (!enteredWithCache) applyUIState();
        cacheProgressLocally();
        closeAuthGate();
        if (enteredWithCache) { syncOk = true; updateSyncIndicator(); render(); }
        else render();
        return;
      }
      // Token không còn hợp lệ (vd tài khoản đã bị xoá, hoặc phiên đăng nhập hết hạn)
      if (!enteredWithCache) openAuthGate();
      else { syncOk = false; updateSyncIndicator(); }
    } catch {
      // Không có mạng / server chưa phản hồi kịp — nếu đã vào bằng cache thì cứ để vậy, đồng bộ lại sau
      if (!enteredWithCache) openAuthGate();
      else { syncOk = false; updateSyncIndicator(); }
    }
    return;
  }
  openAuthGate();
}

// V70 (Task 2 audit — hợp nhất FSRS): TOÀN BỘ hệ "SRS cục bộ" tự viết cũ (step cứng 10p/1h/1
// ngày/3 ngày/7 ngày, lưu trong progressState.srs) đã bị XOÁ khỏi client cho user ĐÃ ĐĂNG NHẬP.
// Lý do: nó là "review queue riêng" / "SRS cũ" chạy song song với FSRS-6 thật (Task 2 cấm), và
// thực ra backend đã ngừng lưu progress.srs từ trước (xem api/index.js `/api/progress` POST —
// "V69: chỉ còn ui, KHÔNG còn srs/streak") — client chỉ chưa được cập nhật theo kịp, khiến dữ
// liệu cũ này chỉ tồn tại "ảo" trên 1 thiết bị, không đồng bộ, không phải nguồn sự thật thật sự.
//
// Từ giờ:
//   - User ĐÃ ĐĂNG NHẬP: streak/known/độ ưu tiên từ đến hạn... đều lấy từ SERVER (FSRS-6 thật,
//     reviewService + fsrs_cards + review_history + study_sessions) — xem serverStreak/
//     serverKnownCount bên dưới + loadFsrsPracticePool()/submitFsrsReview() dùng ở các tab luyện tập.
//   - KHÁCH (chưa đăng nhập): KHÔNG có tài khoản nên không thể có thẻ FSRS thật trên server. Giữ
//     lại 1 cơ chế cực tối giản CHỈ để tính streak hiển thị cục bộ trên máy khách đó (không giả vờ
//     đây là spaced-repetition thật) — xem guestMarkActivity() bên dưới.
// ════════════════════════════════════════════════════
let serverStreak = 0, serverLongestStreak = 0, serverKnownCount = 0;

// Streak hiển thị: user thật → số streak SERVER tính (từ study_sessions thật, Phần 11 Task 6);
// khách → đếm cục bộ đơn giản, chỉ để có con số vui mắt, không phải dữ liệu học tập thật.
function getStreak() { return isGuest ? (progressState.streak || 0) : serverStreak; }

// Chỉ dùng cho KHÁCH: đánh dấu "hôm nay có luyện tập" để tăng streak hiển thị cục bộ. Không tạo
// thẻ SRS/step nào cả — khách luyện Flashcard/Trắc nghiệm/Gõ chữ/Nghe-chọn chỉ để thử, không có
// lịch ôn tập thật (cần đăng nhập mới có FSRS thật, xem app.js `renderToday`).
function guestMarkActivity() {
  if (!isGuest) return;
  const today = new Date().toDateString();
  if (progressState.lastDate === today) return;
  const yesterday = new Date(Date.now() - 86400000).toDateString();
  progressState.streak = (progressState.lastDate === yesterday) ? (progressState.streak || 0) + 1 : 1;
  progressState.lastDate = today;
  cacheProgressLocally();
}

// Gọi lại /api/progress để làm mới streak/known thật sau khi vừa hoàn thành 1 lượt/1 phiên luyện
// tập ở BẤT KỲ tab nào (Task 2: mọi tab đều là "nguồn sự thật" như nhau) — không gọi sau MỖI câu
// trả lời (tốn request), chỉ gọi khi kết thúc 1 phiên/1 thẻ để badge không bị cũ quá lâu.

// ── Ánh xạ chế độ hỏi ở UI → quizType mà server hiểu (Task 2/3: server luôn tự xác định đúng/sai
//     và tự suy FSRS rating — KHÔNG có quizType nào KHÔNG đi qua đây). 'listen' (Nghe-chọn) dùng
//     lại đúng ngữ nghĩa 'vi2hz' (đáp án cần chọn là chữ Hán) vì server chỉ cần biết đáp án đúng
//     là w.hz hay w.vi, không cần phân biệt "nghe" hay "đọc nghĩa" ở tầng so khớp đáp án. ──
function fsrsQuizTypeFor(mode) {
  if (mode === 'Việt→漢' || mode === 'type' || mode === 'listen') return 'vi2hz';
  if (mode === 'Âm→漢') return 'py2hz';
  return 'hz2vi'; // '漢→Việt' hoặc mặc định
}

// ── Lấy pool từ CHÍNH hàng đợi FSRS thật (reviewService + scheduler) của user đang đăng nhập —
//     dùng CHUNG cho Flashcard/Trắc nghiệm/Gõ chữ/Nghe-chọn, giống hệt "Hôm nay học" (Task 2: cấm
//     "review queue riêng"). Vì cùng gọi /api/study/session, 4 tab luyện tập này CHIA SẺ chung 1
//     ngân sách due/new mỗi ngày với "Hôm nay học" — không phải 4 nguồn đếm riêng biệt nữa. ──
async function loadFsrsPracticePool(limit) {
  try {
    const res = await fetch('/api/study/session', { headers: authHeaders() });
    const data = await res.json();
    if (!data.ok) return { words: [], error: data.error || 'Không tải được hàng đợi FSRS' };
    const words = (data.session || []).map(it => it.word).slice(0, limit);
    return { words, blockedByBacklog: !!data.blockedByBacklog, totalDue: data.totalDue || 0 };
  } catch (e) {
    return { words: [], error: e.message };
  }
}

// ── Gửi 1 lượt trả lời lên reviewService (FSRS-6 thật) — dùng CHUNG cho MỌI tab luyện tập của
//     user đã đăng nhập. Server luôn là nguồn sự thật cuối cùng cho answerCorrect + rating (Task
//     3), tự ghi vào review_history + fsrs_cards + study_sessions (Task 4, đã có sẵn ở backend). ──
async function submitFsrsReview({ word, quizType, selectedAnswer, responseTimeMs }) {
  try {
    const res = await fetch('/api/study/review', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', ...authHeaders() },
      body: JSON.stringify({
        wordId: { hz: word.hz, l: word.l },
        quizType,
        selectedAnswer,
        responseTimeMs: Number.isFinite(responseTimeMs) ? Math.round(responseTimeMs) : null,
        answerChanges: 0,
      }),
    });
    const data = await res.json();
    if (!data.ok) console.error('Không lưu được lượt review:', data.error);
    else bumpStudySessionCounters(!!data.answerCorrect); // Task 4: cards_reviewed/đúng/sai tăng dần theo THỜI GIAN THỰC
    return data;
  } catch (e) {
    console.error('Lỗi kết nối khi lưu review:', e);
    return { ok: false, error: e.message };
  }
}

// ════════════════════════════════════════════════════
// V71 (Audit lặp từ) — HÀNG ĐỢI CHỐNG LẶP dùng CHUNG cho MỌI tab học (Hôm nay học/Flashcard/Trắc
// nghiệm/Gõ chữ/Nghe-chọn). Xem báo cáo audit đính kèm để biết nguyên nhân gốc; đây là cơ chế sửa.
// Quy tắc: (1) thẻ vừa trả lời ĐÚNG bị loại khỏi phiên NGAY LẬP TỨC, không nạp lại trong phiên
// này; (2) thẻ bị SAI (Again) được chèn lại nhưng cách tối thiểu REPEAT_GAP thẻ khác; (3) hàng đợi
// nạp 1 LẦN từ đúng /api/study/session (FSRS thật), không random toàn bộ database, không tự ý gọi
// lại server giữa chừng 1 phiên trừ khi hàng đợi đã cạn hẳn.
// ════════════════════════════════════════════════════
const REPEAT_GAP = 10; // N: số thẻ tối thiểu trước khi 1 thẻ bị Again được lặp lại

// Khử trùng lặp theo hz — phòng trường hợp cùng 1 chữ Hán xuất hiện ở nhiều bài (l khác nhau)
// khiến dueCards/newCards phía server chứa 2 "thẻ" khác nhau nhưng CÙNG mặt chữ với người học.
function sqDedupeByHz(words) {
  const seen = new Set();
  return words.filter(w => { if (seen.has(w.hz)) return false; seen.add(w.hz); return true; });
}

function sqCreate() { return { items: [], doneHz: new Set(), totalPlanned: 0, answeredCount: 0 }; }

// Nạp hàng đợi 1 LẦN cho 1 lượt "vào tab" — dùng chung bởi mọi tab luyện tập (đăng nhập: FSRS
// thật qua loadFsrsPracticePool; khách: pool cục bộ theo bài đang chọn).
async function sqLoad(sq, limit) {
  sq.doneHz = new Set(); sq.answeredCount = 0;
  if (isLoggedIn()) {
    const { words, error } = await loadFsrsPracticePool(limit);
    if (error) return { error };
    sq.items = sqDedupeByHz(words);
  } else {
    sq.items = sqDedupeByHz(shuffle(getFilteredWords())).slice(0, limit);
  }
  sq.totalPlanned = sq.items.length;
  return { ok: true };
}

// Gọi SAU KHI có kết quả (server hoặc tự chấm ở khách) cho thẻ đang ở ĐẦU hàng đợi.
function sqAdvance(sq, isCorrect) {
  const w = sq.items.shift();
  if (!w) return;
  sq.answeredCount++;
  if (isCorrect) {
    sq.doneHz.add(w.hz); // loại vĩnh viễn khỏi phiên này — không bao giờ lặp lại nữa
  } else {
    const pos = Math.min(REPEAT_GAP, sq.items.length); // chèn lại cách tối thiểu N thẻ khác
    sq.items.splice(pos, 0, w);
  }
}

// (lib/fsrs/analytics.js SESSION_GAP_MS), nên số liệu KHÔNG bị đếm trùng dù có cả recordStudyActivity
// (ngầm, chạy trong reviewService mỗi lần review) lẫn session/start + heartbeat (chủ động, ở đây).
// ════════════════════════════════════════════════════
const STUDY_TABS = new Set(['review','flash','quiz','type','listen']);
const STUDY_SESSION_GAP_MS = 15 * 60 * 1000; // PHẢI khớp SESSION_GAP_MS ở lib/fsrs/analytics.js

let studySession = { id: null, startedAt: 0, lastActivity: 0, cards: 0, correct: 0, wrong: 0 };
let _studyTimerHandle = null, _studyHeartbeatHandle = null;

function studySessionStorageKey() { return 'studySession_' + (authUsername || ''); }

function cacheStudySession() {
  if (!authUsername) return;
  try { localStorage.setItem(studySessionStorageKey(), JSON.stringify(studySession)); } catch {}
}
function loadCachedStudySession() {
  if (!authUsername) return null;
  try { return JSON.parse(localStorage.getItem(studySessionStorageKey()) || 'null'); } catch { return null; }
}

// Gọi mỗi khi vào 1 tab học — idempotent: nếu đã có phiên hợp lệ (kể cả vừa khôi phục từ
// localStorage sau khi reload trang) thì chỉ tiếp tục đếm giờ, KHÔNG tạo phiên mới vô nghĩa.
async function ensureStudySession() {
  if (!isLoggedIn()) { pauseStudyTimer(); return; } // khách không có tài khoản → không có phiên thật
  const now = Date.now();
  if (!studySession.id) {
    const cached = loadCachedStudySession();
    if (cached && cached.id && (now - cached.lastActivity) <= STUDY_SESSION_GAP_MS) {
      studySession = cached; // Task 5: "reload vẫn khôi phục được session" — cùng 1 sessionId, KHÔNG reset đồng hồ về 0
    }
  }
  if (!studySession.id) {
    try {
      const res = await fetch('/api/study/session/start', { method: 'POST', headers: { 'Content-Type': 'application/json', ...authHeaders() } });
      const data = await res.json();
      if (data.ok) {
        studySession = { id: data.sessionId, startedAt: now, lastActivity: now, cards: 0, correct: 0, wrong: 0 };
        cacheStudySession();
      }
    } catch (e) { console.error('Không mở được phiên học:', e); }
  }
  startStudyTimerTick();
  scheduleStudyHeartbeat();
}

function bumpStudySessionCounters(isCorrect) {
  if (!studySession.id) return;
  studySession.cards++;
  if (isCorrect) studySession.correct++; else studySession.wrong++;
  studySession.lastActivity = Date.now();
  cacheStudySession();
  updateStudyTimerDisplay();
}

function startStudyTimerTick() {
  clearInterval(_studyTimerHandle);
  _studyTimerHandle = setInterval(updateStudyTimerDisplay, 1000);
  updateStudyTimerDisplay();
}

// Dừng ĐẾM HIỂN THỊ khi rời khỏi tab học (Trang chủ, Thống kê,...) — phiên trên server vẫn còn
// hiệu lực trong 15 phút, quay lại tab học sẽ nối tiếp đúng đồng hồ cũ, không mất dữ liệu.
function pauseStudyTimer() {
  clearInterval(_studyTimerHandle); _studyTimerHandle = null;
  clearInterval(_studyHeartbeatHandle); _studyHeartbeatHandle = null;
  const chip = document.getElementById('study-timer-chip');
  if (chip) chip.style.display = 'none';
}

function updateStudyTimerDisplay() {
  const chip = document.getElementById('study-timer-chip');
  if (!chip || !studySession.id) return;
  const secs = Math.max(0, Math.floor((Date.now() - studySession.startedAt) / 1000));
  const hh = Math.floor(secs / 3600), mm = Math.floor((secs % 3600) / 60), ss = secs % 60;
  const pad = n => String(n).padStart(2, '0');
  const time = hh > 0 ? `${pad(hh)}:${pad(mm)}:${pad(ss)}` : `${pad(mm)}:${pad(ss)}`;
  chip.style.display = '';
  chip.textContent = `⏱ ${time}` + (studySession.cards ? ` · ${studySession.cards} thẻ` : '');
}

// Heartbeat mỗi 20s trong lúc đang ở tab học — giữ end_time/duration_seconds cập nhật đều trên
// server dù người dùng đang đọc ví dụ/nghe phát âm chứ chưa bấm trả lời câu nào (Task 4/5).
function scheduleStudyHeartbeat() {
  clearInterval(_studyHeartbeatHandle);
  _studyHeartbeatHandle = setInterval(async () => {
    if (!studySession.id) return;
    try {
      const res = await fetch('/api/study/session/heartbeat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', ...authHeaders() },
        body: JSON.stringify({ sessionId: studySession.id }),
      });
      const data = await res.json();
      if (data.ok) { studySession.lastActivity = Date.now(); cacheStudySession(); }
      else { studySession = { id: null, startedAt: 0, lastActivity: 0, cards: 0, correct: 0, wrong: 0 }; } // phiên đã hết hạn phía server — lần sau mở phiên mới
    } catch { /* mất mạng tạm thời — thử lại ở nhịp heartbeat kế tiếp, không xoá phiên */ }
  }, 20000);
}

let ttsVoice = null;
let ttsRate = 0.65;

function initTTS() {
  const load = () => {
    const voices = speechSynthesis.getVoices();
    // Priority: female zh-CN voices
    const femaleKeywords = ['female','woman','girl','Xiaoyi','Xiaoxiao','HuiHui','Yaoyao','Tracy','Meijia','Tingting','Hanhan'];
    const zhVoices = voices.filter(v => v.lang.startsWith('zh'));
    // Try to find a female voice
    let pick = null;
    for (const kw of femaleKeywords) {
      pick = zhVoices.find(v => v.name.toLowerCase().includes(kw.toLowerCase()));
      if (pick) break;
    }
    // Fallback: any zh voice, prefer name containing 'CN'
    if (!pick) pick = zhVoices.find(v => v.lang === 'zh-CN') || zhVoices[0] || null;
    ttsVoice = pick;
    console.log('[TTS] selected voice:', ttsVoice ? ttsVoice.name : 'none', '| all zh voices:', zhVoices.map(v=>v.name));
  };
  speechSynthesis.onvoiceschanged = load;
  load();
}
initTTS();

function updateSpeed(val) {
  ttsRate = parseFloat(val);
  const el = document.getElementById('speed-val');
  if (el) el.textContent = ttsRate.toFixed(2);

}

// Split text into natural phrase chunks at Chinese punctuation + commas
function splitPhrases(text) {
  // Split at：，。！？、；— keep delimiter with preceding chunk
  const parts = [];
  let buf = '';
  for (let i = 0; i < text.length; i++) {
    buf += text[i];
    if ('，。！？、；…—,!?;'.includes(text[i])) {
      parts.push(buf.trim());
      buf = '';
    }
  }
  if (buf.trim()) parts.push(buf.trim());
  return parts.filter(Boolean);
}

// Speak with natural phrasing: queue utterances with micro-pauses between chunks
function speak(text) {
  if (!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();

  const phrases = splitPhrases(text);

  // If single short word, just speak directly
  if (phrases.length <= 1) {
    const utt = new SpeechSynthesisUtterance(text);
    utt.lang = 'zh-CN';
    utt.rate = ttsRate;
    utt.pitch = 1.05;
    if (ttsVoice) utt.voice = ttsVoice;
    speechSynthesis.speak(utt);
    return;
  }

  // Queue each phrase; insert a tiny silent utterance as pause between phrases
  phrases.forEach((phrase, i) => {
    const utt = new SpeechSynthesisUtterance(phrase);
    utt.lang = 'zh-CN';
    utt.rate = ttsRate;
    utt.pitch = 1.05;
    if (ttsVoice) utt.voice = ttsVoice;
    speechSynthesis.speak(utt);

    // Insert micro-pause after each phrase except last
    if (i < phrases.length - 1) {
      const pause = new SpeechSynthesisUtterance(' ');
      pause.lang = 'zh-CN';
      pause.rate = ttsRate;
      pause.volume = 0;
      if (ttsVoice) pause.voice = ttsVoice;
      speechSynthesis.speak(pause);
    }
  });
}

const AC = new (window.AudioContext || window.webkitAudioContext || function(){})();
function playDing() {
  try {
    const o = AC.createOscillator(), g = AC.createGain();
    o.connect(g); g.connect(AC.destination);
    o.type='sine'; o.frequency.value=880;
    g.gain.setValueAtTime(.3,AC.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+.4);
    o.start(); o.stop(AC.currentTime+.4);
  } catch {}
}
function playBuzz() {
  try {
    const o = AC.createOscillator(), g = AC.createGain();
    o.connect(g); g.connect(AC.destination);
    o.type='sawtooth'; o.frequency.value=140;
    g.gain.setValueAtTime(.25,AC.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+.35);
    o.start(); o.stop(AC.currentTime+.35);
  } catch {}
}

function mergeDiscoveredLessonsIntoBooks() {

    .map(k => parseInt(k, 10))
    .filter(l => Number.isFinite(l) && vocabCounts[l] > 0 && !isCovered(l))
    .sort((a,b) => a-b);
  for (const l of discovered) {

  if (_bookCountCache.len !== WORDS.length) {
    const counts = {};
    for (const b of BOOKS) counts[b.id] = 0;
    for (const w of WORDS) {
      const b = BOOKS.find(x => w.l >= x.from && w.l <= x.to);
      if (b) counts[b.id]++;
    }
    _bookCountCache = { len: WORDS.length, counts };
  }
  const b = BOOKS.find(x => x.id === bookId);
  if (b && !loadedLessonNumbers.has(b.from)) {
    let sum = 0;
    for (let l = b.from; l <= b.to; l++) sum += vocabCounts[l] || 0;
    return sum;
  }
  return _bookCountCache.counts[bookId] || 0;
}

// Thẻ chọn Quyển/level, nhóm theo từng loại (Giáo trình cơ bản / Từ vựng mở rộng / Luyện thi HSK...)
// Có thể chạm nhiều thẻ để chọn cùng lúc.
function levelSelectHtml() {
  const loggedIn = isLoggedIn();
  const groups = [];
  for (const b of BOOKS) if (!groups.includes(b.group)) groups.push(b.group);
  return groups.map(g => {
    // Ẩn các bài không còn từ nào (0 từ) khỏi màn chọn — trừ khi đang được chọn sẵn,
    // để tránh tình trạng "bài thừa" còn sót lại sau khi xoá/nhập lại dữ liệu.
    const booksInGroup = BOOKS.filter(b => b.group === g)
      .filter(b => bookWordCount(b.id) > 0 || selectedBookIds.has(b.id));
    if (booksInGroup.length === 0) return '';
    const cards = booksInGroup.map(b => {
      const locked = !loggedIn && b.id !== 1;
      const sel = selectedBookIds.has(b.id);
      const count = bookWordCount(b.id);
      return `<button class="book-card${sel?' sel':''}${locked?' locked':''}" onclick="toggleBook(${b.id})">
        ${locked?'<span class="book-card-lock">🔒</span>':''}
        <span class="book-card-name">${b.name}</span>
        <span class="book-card-count">${count} từ</span>
      </button>`;
    }).join('');
    return `<div class="book-group">
      <div class="book-group-label">${g}</div>
      <div class="book-grid">${cards}</div>
    </div>`;
  }).join('');
}

// Chip chọn bài cụ thể — CHỈ áp dụng cho các Quyển có nhiều hơn 1 bài (Quyển 1, Quyển 2).
// Chuyên ngành / HSK... mỗi mục chỉ có đúng 1 bài nên không cần (và không hiện) phần chọn thêm này.
function lessonSelectHtml() {
  const multiLessonIds = [...selectedBookIds].filter(id => {
    const b = BOOKS.find(x => x.id === id);
    return b && (b.to > b.from);
  });
  if (multiLessonIds.length === 0) return '';
  const set = new Set();
  for (const id of multiLessonIds) for (const l of lessonsOfBook(id)) set.add(l);
  const lessons = [...set].sort((a,b)=>a-b);
  const loggedIn = isLoggedIn();
  const allBtn = `<button class="lbtn${lessonsAllMode?' sel':''}" style="${lessonsAllMode ? `border-color:var(--active);background:var(--active);color:#fff;` : `border-color:var(--active);background:${lessonBg(0)};color:var(--active);`}" onclick="selectAllLessonsInSelection()">Tất cả</button>`;
  const chips = lessons.map(l => {
    const sel = !lessonsAllMode && selectedLessons.has(l);
    const locked = !loggedIn && l > GUEST_MAX_LESSON;
    const style = sel
      ? `border-color:${lessonColor(l)};background:${lessonColor(l)};color:#fff;`
      : `border-color:${lessonColor(l)};background:${lessonBg(l)};color:${lessonColor(l)};`;
    return `<button class="lbtn${sel?' sel':''}${locked?' locked':''}" style="${style}${locked?'opacity:.5;':''}" onclick="toggleLessonChip(${l})">${locked?'🔒 ':''}Bài ${l}</button>`;
  }).join('');
  return `<div style="font-size:.72rem;color:var(--muted);font-weight:700;margin:8px 0 4px;">Chọn bài cụ thể (có thể bỏ tích hết để không chọn bài nào)</div>
    <div id="lesson-filter">${allBtn}${chips}</div>`;
}

// REVIEW SESSION — V67: AUTO FSRS RATING, không còn nút Again/Hard/Good/Easy.
// Flow mới (Phần 1/2/17): hiện chữ Hán → user chọn 1 trong 4 đáp án trắc nghiệm → hệ thống tự
// xác định đúng/sai + đo responseTime → gửi lên server → server tự suy ra FSRS rating, gọi
// ts-fsrs, lưu lịch → lộ đáp án đầy đủ (pinyin/nghĩa/Hán Việt/chiết tự/ví dụ) → tự chuyển câu kế.
// Người dùng KHÔNG bao giờ thấy rating Again/Hard/Good/Easy trong chế độ mặc định (Phần 2/18).
// ════════════════════════════════════════════════════
let rvSession = [];
let rvPhase = 'question'; // 'question' (đang chờ chọn đáp án) | 'answered' (đã có kết quả)
let rvWeakMode = false;
let rvSummary = { reviewCount: 0, newCount: 0 };
let rvExamplePool = [];
let rvSubmitting = false;
let rvOptions = [];      // 4 lựa chọn trắc nghiệm của câu hiện tại (sinh 1 lần/câu, không sinh lại mỗi lần render)
let rvStartedAt = 0;     // performance.now() tại thời điểm câu hỏi THỰC SỰ hiển thị cho user (Phần 4)
let rvAnswerChanges = 0; // UI hiện tại chọn là chốt ngay (không cho đổi trước khi submit) nên luôn 0 (Phần 16/17)
let rvLastAnswer = null; // { correct, card, autoRating } — kết quả lượt vừa submit, để hiện feedback (Phần 18)
let rvDoneHz = new Set(); // V71: hz đã trả lời ĐÚNG trong phiên này — không bao giờ nạp/hiện lại
let rvTotalPlanned = 0;   // V71: cỡ hàng đợi lúc nạp (để tính % tiến độ; rvSession có thể tạm dài hơn do Again được chèn lại)
let rvAnsweredCount = 0;  // V71: số câu đã trả lời (kể cả Again) trong phiên này
const RV_QUIZ_TYPE = 'hz2vi'; // Phần 1: mặc định hỏi "chữ Hán → nghĩa", khớp đúng ví dụ trong yêu cầu V67

// V71: khử trùng lặp {type,word} theo word.hz — cùng lý do với sqDedupeByHz (1 chữ Hán có thể gắn
// với 2 "thẻ" khác nhau ở 2 bài khác nhau phía server).
function rvDedupeSession(list) {
  const seen = new Set();
  return list.filter(it => { if (seen.has(it.word.hz)) return false; seen.add(it.word.hz); return true; });
}

async function startStudySession(weakMode) {
  rvWeakMode = !!weakMode;
  rvExamplePool = []; rvLastAnswer = null;
  rvDoneHz = new Set(); rvAnsweredCount = 0;
  goTab('review');
  const el = document.getElementById('content');
  if (el) el.innerHTML = `<div class="study-empty">Đang tải phiên học...</div>`;
  try {
    if (rvWeakMode) {
      const res = await fetch('/api/study/weak-words', { headers: authHeaders() });
      const data = await res.json();
      if (!data.ok) { alert(data.error || 'Không tải được từ hay quên'); goTab('today'); return; }
      rvSession = rvDedupeSession(data.words.map(w => ({ type: 'review', word: w })));
      rvSummary = { reviewCount: rvSession.length, newCount: 0 };
    } else {
      const res = await fetch('/api/study/session', { headers: authHeaders() });
      const data = await res.json();
      if (!data.ok) { alert(data.error || 'Không tải được phiên học'); goTab('today'); return; }
      rvSession = rvDedupeSession(data.session || []);
      rvSummary = { reviewCount: data.reviewCount || 0, newCount: data.newCount || 0 };
    }
  } catch (e) {
    alert('Lỗi kết nối: ' + e.message);
    goTab('today');
    return;
  }
  rvTotalPlanned = rvSession.length;
  // Nạp trước kho ví dụ cho các bài xuất hiện trong session (Phần 24) — không chặn hiển thị.
  const lessonsInSession = [...new Set(rvSession.map(it => it.word.l))];
  if (lessonsInSession.length && !isGuest && authToken) {
    fetch('/api/word-examples?lessons=' + lessonsInSession.join(','), { headers: authHeaders() })
      .then(r => r.json()).then(d => { if (d.ok) rvExamplePool = d.examples || []; })
      .catch(() => {});
  }
  rvPrepareCurrentCard();
  render();
}

function rvFindExample(hz) {
  const matches = rvExamplePool.filter(e => e.hz === hz);
  if (!matches.length) return null;
  return matches[Math.floor(Math.random() * matches.length)];
}

// Sinh 4 lựa chọn trắc nghiệm cho thẻ Ở ĐẦU hàng đợi, và bắt đầu đo responseTime NGAY tại đây
// (thời điểm câu hỏi thực sự sẵn sàng cho user — Phần 4, không tính thời gian từ lúc mở session).
function rvPrepareCurrentCard() {
  if (!rvSession.length) return;
  const w = rvSession[0].word;
  rvOptions = rvMakeOpts(w);
  rvAnswerChanges = 0;
  rvPhase = 'question';
  rvLastAnswer = null;
  rvStartedAt = performance.now();
}

// Ước lượng còn bao lâu tới lần ôn tiếp theo, chỉ để hiển thị thông tin cho user (Phần 18) —
// KHÔNG dùng để quyết định gì thêm, due thật đã được server/FSRS tính và lưu xong.
function rvSavedLine(r) {
  if (!r) return '';
  if (!r.card || !r.card.due) return '📌 Đã lưu lịch ôn';
  const diffMs = new Date(r.card.due).getTime() - Date.now();
  const diffDays = Math.round(diffMs / 86400000);
  if (diffDays <= 0) return '📌 Đã lưu lịch ôn — sẽ xuất hiện lại rất sớm';
  if (diffDays === 1) return '📌 Đã lưu lịch ôn — ôn lại sau 1 ngày';
  return `📌 Đã lưu lịch ôn — ôn lại sau ${diffDays} ngày`;
}

function renderReview() {
  if (!rvSession.length) {
    return `<div class="rv-done">
      <div class="rv-done-num">🎉</div>
      <div style="font-size:1.3rem;font-weight:800;margin:10px 0;">Xong phiên học!</div>
      <div style="color:var(--muted);margin-bottom:20px;">Đã ôn ${rvSummary.reviewCount} từ, học ${rvSummary.newCount} từ mới.</div>
      <button class="btn btn-primary" onclick="goTab('today')">Về Hôm nay học</button>
    </div>`;
  }
  const item = rvSession[0];
  const w = item.word;
  const pct = Math.min(100, Math.round((rvAnsweredCount / (rvTotalPlanned||1)) * 100));
  const tagLabel = item.type === 'new' ? '🆕 Từ mới' : '🔁 Ôn tập';
  let body;
  if (rvPhase === 'question') {
    // Chỉ 1 bước duy nhất: nhìn chữ Hán → chọn nghĩa đúng (Phần 1/17). Không có bước "tự nhớ rồi
    // bấm Đúng/Sai" riêng như v66 — hệ thống tự xác định đúng/sai khi user chọn đáp án.
    const optHtml = rvOptions.map(o =>
      `<button class="quiz-opt" data-v="${o.vi}" onclick="rvPick(this,'${o.hz}')" ${rvSubmitting ? 'disabled' : ''}>${o.vi}</button>`
    ).join('');
    body = `
      <div class="rv-tag">${tagLabel} · Bài ${w.l}</div>
      <div class="rv-hz">${w.hz}</div>
      ${showPinyin ? `<div class="rv-py">${w.py || ''}</div>` : ''}
      <div class="rv-prompt">${w.hz} là gì?</div>
      <div class="quiz-opts" id="rv-opts">${optHtml}</div>`;
  } else {
    // Đã có kết quả: lộ đáp án đầy đủ + trạng thái lưu FSRS. KHÔNG hiện Again/Hard/Good/Easy
    // (Phần 2/18) — chỉ hiện khi bật chế độ debug/advanced dành cho admin (Phần 19/22).
    const r = rvLastAnswer;
    const ex = rvFindExample(w.hz);
    body = `
      <div class="rv-tag">${tagLabel} · Bài ${w.l}</div>
      <div class="rv-hz">${w.hz}</div>
      <div class="rv-feedback" style="color:${r && r.correct ? 'var(--l8a)' : 'var(--l10a)'};">
        ${r && r.correct ? '✅ Chính xác' : '❌ Chưa đúng'}
      </div>
      ${showPinyin ? `<div class="rv-py">${w.py || ''}</div>` : ''}
      ${showMeaning ? `<div class="rv-vi">${w.vi || ''}</div>` : ''}
      ${showHanViet && w.hanviet ? `<div class="rv-hv">Hán Việt: ${w.hanviet}</div>` : ''}
      ${renderHanziParts(w.hz)}
      ${ex ? `<div class="rv-ex">${ex.zh}<br><span style="color:var(--muted);font-size:.85rem;">${ex.vi}</span></div>` : ''}
      <div class="rv-saved-line">${rvSavedLine(r)}</div>
      ${(!isGuest && isAdminRole() && r && r.autoRating) ? `<div class="rv-saved-line">🐞 debug: auto rating = ${r.autoRating}</div>` : ''}`;
  }
  return `
    <div class="rv-progress-wrap"><div class="rv-progress-fill" style="width:${pct}%;"></div></div>
    <div class="rv-counter">Câu ${rvAnsweredCount + 1} · còn ${rvSession.length} trong hàng đợi</div>
    <div class="rv-card">${body}</div>
  `;
}

// Đánh dấu đáp án đúng lên từng nút NGAY SAU KHI render xong (Phần 17), giống cách bindQuiz đang
// làm cho tab Trắc nghiệm — để rvPick() biết ngay đáp án vừa chọn đúng hay sai mà không cần chờ
// server trả lời (server vẫn là nguồn sự thật cuối cùng, việc này chỉ để phản hồi UI tức thời).
function bindReview() {
  if (rvPhase !== 'question' || !rvSession.length) return;
  const w = rvSession[0].word;
  document.querySelectorAll('#rv-opts .quiz-opt').forEach(b => {
    b._correct = (b.dataset.v === w.vi);
  });
}

// ── Phần 1/3/4/17/20: user chọn 1 đáp án → khoá UI, hiện đúng/sai tức thời → gửi
//     selectedAnswer + responseTimeMs lên server (server tự xác định lại đúng/sai + tự suy ra
//     FSRS rating + gọi ts-fsrs + lưu — KHÔNG có bước nào cần user bấm thêm). ──
async function rvPick(btn, hz) {
  if (rvSubmitting || rvPhase !== 'question') return;
  rvSubmitting = true;
  const responseTimeMs = Math.round(performance.now() - rvStartedAt); // Phần 4
  const item = rvSession[0];
  const w = item.word;
  const isCorrectLocally = !!btn._correct;
  const selectedAnswer = btn.dataset.v;

  document.querySelectorAll('#rv-opts .quiz-opt').forEach(b => {
    if (b._correct) b.classList.add('correct');
    else if (b === btn && !isCorrectLocally) b.classList.add('wrong');
    b.disabled = true;
  });
  if (isCorrectLocally) playDing(); else playBuzz();
  speak(w.hz);

  let result = { correct: isCorrectLocally, card: null, autoRating: null };
  try {
    const res = await fetch('/api/study/review', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', ...authHeaders() },
      body: JSON.stringify({
        wordId: { hz: w.hz, l: w.l },
        quizType: RV_QUIZ_TYPE,
        selectedAnswer,
        responseTimeMs,
        answerChanges: rvAnswerChanges,
      }),
    });
    const data = await res.json();
    if (data.ok) {
      result = {
        correct: data.answerCorrect, // server là nguồn sự thật cuối cùng (Phần 3/20)
        card: data.card,
        autoRating: data.debug ? data.debug.autoRating : null,
      };
      bumpStudySessionCounters(!!data.answerCorrect); // Task 4: cards_reviewed/đúng/sai tăng dần theo thời gian thực
    } else {
      console.error('Không lưu được kết quả review:', data.error);
    }
  } catch (e) {
    console.error('Lỗi kết nối — kết quả review này có thể chưa được lưu:', e);
  }

  rvLastAnswer = result;
  rvPhase = 'answered';
  rvSubmitting = false;
  render();
  // Chuyển câu tiếp theo tự động sau 1 khoảng ngắn — không cần user bấm gì thêm (Phần 17).
  setTimeout(rvAdvance, 1600);
}

// V71: thẻ Ở ĐẦU hàng đợi bị loại NGAY LẬP TỨC sau khi có kết quả server. Đúng → loại vĩnh viễn
// khỏi phiên (rvDoneHz). Sai (Again) → chèn lại cách tối thiểu REPEAT_GAP thẻ khác, KHÔNG gọi lại
// server giữa phiên — hàng đợi cạn thật (kể cả các thẻ Again đã được xử lý xong) mới coi là hết.
function rvAdvance() {
  if (currentTab !== 'review') return; // user đã rời màn hình, tránh render nhầm chỗ
  const it = rvSession.shift();
  if (it) {
    rvAnsweredCount++;
    const isCorrect = !!(rvLastAnswer && rvLastAnswer.correct);
    if (isCorrect) rvDoneHz.add(it.word.hz);
    else rvSession.splice(Math.min(REPEAT_GAP, rvSession.length), 0, it);
  }
  if (!rvSession.length) refreshServerMeta(); // hết phiên — làm mới streak/known thật
  rvPrepareCurrentCard();
  render();
}

// Chiết tự bộ thủ lấy từ database (AI sinh, phủ toàn bộ từ vựng) — tải 1 lần lúc mở app
let dbHanziParts = {};
async function loadHanziParts() {
  if (isGuest || !authToken) return;
  try {
    const res = await fetch('/api/hanzi-parts', { headers: authHeaders() });
    const data = await res.json();
    if (data.ok && Array.isArray(data.parts)) {
      for (const row of data.parts) dbHanziParts[row.hz] = row.parts;
    }
  } catch {
    // Không tải được thì dùng tạm từ điển có sẵn trong code (phủ ít hơn), không chặn app
  }
}

function renderHanziParts(hz, expanded) {
  const cjk = /[\u4e00-\u9fff]/;
  const chars = [...hz];
  const rows = chars.map(ch => {
    // Ưu tiên dữ liệu từ database (AI sinh, phủ rộng hơn), fallback về từ điển nhỏ có sẵn trong code
    const dbEntry = dbHanziParts[ch];
    if (dbEntry) {
      if (dbEntry.type === 'parts' && Array.isArray(dbEntry.items) && dbEntry.items.length) {
        const chips = dbEntry.items.map(x => `<span class="fc-parts-chip">${x.c}</span><span class="fc-parts-note">${x.m}</span>`).join(' + ');
        return `<div class="fc-parts-row"><span class="fc-parts-char">${ch}</span><span class="fc-parts-comps">${chips}</span></div>`;
      }
      if (dbEntry.type === 'note' && dbEntry.text) {
        return `<div class="fc-parts-row"><span class="fc-parts-char">${ch}</span><span class="fc-parts-comps fc-parts-note">${dbEntry.text}</span></div>`;
      }
    }
    const entry = HANZI_PARTS[ch];
    if (entry) {
      if (Array.isArray(entry)) {
        const chips = entry.map(([c,m]) => `<span class="fc-parts-chip">${c}</span><span class="fc-parts-note">${m}</span>`).join(' + ');
        return `<div class="fc-parts-row"><span class="fc-parts-char">${ch}</span><span class="fc-parts-comps">${chips}</span></div>`;
      }
      return `<div class="fc-parts-row"><span class="fc-parts-char">${ch}</span><span class="fc-parts-comps fc-parts-note">${entry}</span></div>`;
    }
    // Chưa có dữ liệu — chỉ báo "đang chờ" cho chữ Hán thật sự (bỏ qua số/chữ Latin lẫn trong từ)
    if (!cjk.test(ch)) return '';
    return `<div class="fc-parts-row"><span class="fc-parts-char">${ch}</span><span class="fc-parts-comps fc-parts-note" style="opacity:.65">⏳ Đang chờ AI xử lý chữ này</span></div>`;
  }).join('');
  if (!rows) return '';
  return `<div class="fc-parts-wrap${expanded ? ' qz-parts' : ''}" onclick="event.stopPropagation()"><div class="fc-parts-title">🧩 Bộ thủ / thành phần</div>${rows}</div>`;
}

// ── Chấm điểm giọng đọc — dùng tính năng nhận diện giọng nói có sẵn của trình duyệt (Chrome/Edge),
//    so khớp văn bản được nhận diện với chữ Hán cần đọc. Không cần server/AI, miễn phí, tức thì.
let pronRecognition = null;
// ── Chấm điểm phát âm bằng AI — ghi âm 3 giây rồi gửi cho Gemini nghe và đánh giá thanh điệu/phát âm ──
let pronMediaRecorder = null;
function blobToBase64(blob) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onloadend = () => resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(blob);
  });
}
async function pronounceTest() {
  const w = fcQueue.items[0];
  const area = document.getElementById('fc-pron-result');
  if (!w || !area) return;
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder) {
    area.innerHTML = `<div style="color:var(--wrong);font-size:.8rem;text-align:center;margin-top:8px;">⚠️ Trình duyệt này không hỗ trợ ghi âm. Hãy dùng Chrome hoặc Edge.</div>`;
    return;
  }
  if (pronMediaRecorder && pronMediaRecorder.state === 'recording') { try { pronMediaRecorder.stop(); } catch {} return; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const mimeType = MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm'
      : (MediaRecorder.isTypeSupported('audio/mp4') ? 'audio/mp4' : '');
    const rec = new MediaRecorder(stream, mimeType ? { mimeType } : undefined);
    pronMediaRecorder = rec;
    const chunks = [];
    rec.ondataavailable = (e) => { if (e.data.size > 0) chunks.push(e.data); };

    let seconds = 3;
    area.innerHTML = `<div style="color:var(--wrong);font-size:.85rem;text-align:center;margin-top:8px;font-weight:700;">🔴 Đang ghi âm... đọc to chữ <b>${w.hz}</b> (<span id="fc-pron-timer">${seconds}</span>s)</div>`;
    const timer = setInterval(() => {
      seconds--;
      const t = document.getElementById('fc-pron-timer');
      if (t) t.textContent = Math.max(seconds, 0);
      if (seconds <= 0) clearInterval(timer);
    }, 1000);

    rec.onstop = async () => {
      clearInterval(timer);
      stream.getTracks().forEach(t => t.stop());
      const blob = new Blob(chunks, { type: rec.mimeType || mimeType || 'audio/webm' });
      if (blob.size === 0) {
        area.innerHTML = `<div style="color:var(--muted);font-size:.82rem;text-align:center;margin-top:8px;">⚠️ Không ghi được âm thanh, thử lại nhé.</div>`;
        return;
      }
      area.innerHTML = `<div style="color:var(--muted);font-size:.82rem;text-align:center;margin-top:8px;">⏳ AI đang chấm phát âm...</div>`;
      try {
        const base64 = await blobToBase64(blob);
        const res = await fetch('/api/pronunciation/grade', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', ...authHeaders() },
          body: JSON.stringify({ hz: w.hz, py: w.py, vi: w.vi, audio: base64, mimeType: blob.type }),
        });
        const data = await res.json();
        if (!data.ok) { area.innerHTML = `<div style="color:var(--wrong);font-size:.82rem;text-align:center;margin-top:8px;">❌ ${data.error}</div>`; return; }
        const r = data.result || {};
        const score = Number.isFinite(r.score) ? r.score : 0;
        const color = score >= 8 ? 'var(--l8a)' : (score >= 5 ? '#b45309' : 'var(--l10a)');
        const bg = score >= 8 ? 'var(--l8c)' : (score >= 5 ? '#fffbeb' : 'var(--l10c)');
        area.innerHTML = `<div style="background:${bg};color:${color};border-radius:10px;padding:10px 12px;text-align:center;margin-top:6px;">
          <div style="font-weight:900;font-size:1.3rem;">${score}/10</div>
          <div style="font-size:.85rem;font-weight:700;margin-top:2px;">${r.comment || ''}</div>
          ${r.heardAs ? `<div style="font-size:.75rem;font-weight:400;margin-top:3px;opacity:.85;">AI nghe được: ${r.heardAs}</div>` : ''}
        </div>`;
      } catch (e) {
        area.innerHTML = `<div style="color:var(--wrong);font-size:.82rem;text-align:center;margin-top:8px;">❌ Không kết nối được máy chủ: ${e.message}</div>`;
      }
    };
    rec.start();
    setTimeout(() => { if (rec.state === 'recording') rec.stop(); }, seconds * 1000 + 50);
  } catch (e) {
    area.innerHTML = `<div style="color:var(--muted);font-size:.82rem;text-align:center;margin-top:8px;">⚠️ Không dùng được micro — cần cho phép quyền truy cập micro trong trình duyệt.</div>`;
  }
}

// V70 (Task 2/3 audit): thay vì "recordAnswer" cục bộ, mỗi lượt tự chấm Đã nhớ/Chưa nhớ giờ đi
// qua ĐÚNG reviewService.reviewCard() như mọi tab khác (user đã đăng nhập). "Đã nhớ" gửi đáp án
// đúng, "Chưa nhớ" gửi 1 chuỗi chắc chắn sai — server tự xác định answerCorrect + suy FSRS rating
// (Again nếu chưa nhớ; Good/Hard/Easy tuỳ baseline nếu đã nhớ, Phần 6/9/10 lib/fsrs-auto-rating.js).
// V70/V71: ok=true/false đã đủ xác định answerCorrect ở server (selectedAnswer=w.vi khi true,
// sentinel chắc chắn sai khi false) nên biết ngay kết quả, không cần chờ round-trip mới sqAdvance.
function fcAnswer(ok) {
  const w = fcQueue.items[0];
  if (!w) return;
  if (isLoggedIn()) {
    const selectedAnswer = ok ? w.vi : '⨯ (tự chấm: chưa nhớ) ⨯';
    submitFsrsReview({ word: w, quizType: 'hz2vi', selectedAnswer, responseTimeMs: fcResponseTimeMs });
  } else {
    guestMarkActivity();
  }
  sqAdvance(fcQueue, ok);
  fcFlipped = false;
  fcUpdate();
}

// Tải toàn bộ ví dụ theo từ (kho đảm bảo mỗi từ có sẵn vài câu) cho các bài đang học
async function qzLoadSentencePool() {
  qzWordExamples = [];
  const lessons = lessonsAllMode ? lessonsOfSelection() : [...selectedLessons];
  if (!lessons.length || isGuest || !authToken) return;
  try {
    const res = await fetch('/api/word-examples?lessons=' + lessons.join(','), { headers: authHeaders() });
    const data = await res.json();
    if (data.ok && Array.isArray(data.examples)) qzWordExamples = data.examples;
  } catch {
    // Không có câu ví dụ thì thôi, không chặn phần trắc nghiệm
  }
}
// Chọn NGẪU NHIÊN 1 trong các câu ví dụ có sẵn của đúng từ đang hỏi
function qzFindExample(hz) {
  const matches = qzWordExamples.filter(e => e.hz === hz);
  if (matches.length === 0) return null;
  return matches[Math.floor(Math.random() * matches.length)];
}

  let qHtml, optHtml;

    : '';

  // (Việt→漢, Âm→漢) chữ Hán chính là đáp án cần đoán, hiện chiết tự sẽ lộ đáp án.
  const partsHtml = qzType === '漢→Việt' ? renderHanziParts(w.hz, true) : '';

    b._correct = (b.dataset.v === (qzType==='漢→Việt' ? w.vi : w.hz));

// V70/V71: mỗi lượt trả lời đi qua ĐÚNG reviewService.reviewCard() (user đã đăng nhập). Server tự
// xác định đúng/sai + suy FSRS rating. sqAdvance() đảm bảo thẻ vừa đúng bị loại khỏi phiên ngay,
// thẻ sai chỉ lặp lại sau tối thiểu REPEAT_GAP thẻ khác — KHÔNG bao giờ tự gọi lại server giữa
// chừng phiên (hàng đợi cạn thật mới coi là hết phiên, xem qzRenderQ).
function qzPick(btn, hz) {
  const w = qzQueue.items[0];
  const isCorrectLocally = btn._correct;
  const responseTimeMs = performance.now() - qzStartedAt;
  document.querySelectorAll('#qz-opts .quiz-opt').forEach(b=>{
    if (b._correct) b.classList.add('correct');
    else if (b === btn && !isCorrectLocally) b.classList.add('wrong');
    b.disabled=true;
  });
  if (isCorrectLocally) playDing(); else playBuzz();
  speak(w.hz);
  (async () => {
    let isCorrect = isCorrectLocally;
    if (isLoggedIn()) {
      const data = await submitFsrsReview({ word: w, quizType: fsrsQuizTypeFor(qzType), selectedAnswer: btn.dataset.v, responseTimeMs });
      if (data && data.ok) isCorrect = !!data.answerCorrect; // server là nguồn sự thật cuối cùng
    } else {
      guestMarkActivity();
    }
    if (isCorrect) qzScore++;
    setTimeout(()=>{ sqAdvance(qzQueue, isCorrect); qzRenderQ(); }, 1400);
  })();
}

// Nhóm từ theo chủ đề ngữ nghĩa (cùng phạm trù dễ gây nhầm lẫn khi học, dù chữ Hán không liên quan)
const SEMANTIC_GROUPS = [
  ['白','白色','黑','红','绿','蓝'],
  ['东边','西边','南边','北边','里边','外边','上边','下边','前边','后边','左边','右边','中间','里'],
  ['星期一','星期二','星期三','星期四','星期五','星期六','星期天','星期'],
  ['爸爸','妈妈','哥哥','姐姐','弟弟','妹妹'],
  ['一','二','三','四','五','六','七','八','九','十','百','千','万','零'],
  ['人民币','美元','港币','日元','欧元'],
  ['早上','上午','中午','下午','晚上','早','晚'],
  ['今天','明天','昨天','今年','去年','明年','后年'],
  ['中国','中文','英国','英文','美国','法国','法文','德国','德语','韩国','韩文','日本（国）','日文','俄国','俄文','西班牙语','西班牙文','阿拉伯语','日语','英语','法语','俄语','韩国语'],
  ['个','位','本','张','支','辆','件','条','层','座','道','遍','片','斤','公斤','瓶','块'],
];
let _semanticMap = null;
function getSemanticMap() {
  if (_semanticMap) return _semanticMap;
  _semanticMap = {};
  SEMANTIC_GROUPS.forEach(g => {
    g.forEach(h => {
      if (!_semanticMap[h]) _semanticMap[h] = new Set();
      g.forEach(h2 => { if (h2 !== h) _semanticMap[h].add(h2); });
    });
  });
  return _semanticMap;
}

// Bản đồ tra nhanh: chữ Hán -> tập các chữ Hán "dễ nhầm" cùng nhóm (từ CONFUSE_GROUPS)
let _confuseMap = null;
function getConfuseMap() {
  if (_confuseMap) return _confuseMap;
  _confuseMap = {};
  CONFUSE_GROUPS.forEach(g => {
    const hzs = g.chars.map(c => c.hz);
    hzs.forEach(h => {
      if (!_confuseMap[h]) _confuseMap[h] = new Set();
      hzs.forEach(h2 => { if (h2 !== h) _confuseMap[h].add(h2); });
    });
  });
  return _confuseMap;
}

// Từ nối/hư từ tiếng Việt hay lặp lại trong bản dịch — bỏ qua để so khớp ngữ nghĩa chính xác hơn
const VI_STOPWORDS = new Set(['và','là','có','của','một','rất','này','đó','với','hay','cũng','cần','cho','khi','ra','lên','xuống','trong','ngoài','trước','sau','gì','nào','thế','làm','đi','đến','ở','ạ','thì','còn','sẽ','đã','đang','bị','được','như','các','những','vì','nên','mà','nếu','nữa','chỉ','vẫn','phải','không','hoặc']);
function viTokens(vi) {
  return (vi || '').toLowerCase()
    .replace(/[()]/g, '')
    .split(/[,\/;]|\s+/)
    .map(t => t.trim())
    .filter(t => t.length > 1 && !VI_STOPWORDS.has(t));
}

// V67: dùng chung cho cả tab Trắc nghiệm (pool = getFilteredWords, theo đúng phạm vi bài user
// đang chọn) và phiên Review/FSRS (pool = toàn bộ WORDS, vì 1 thẻ due có thể thuộc bài NGOÀI
// phạm vi filter hiện tại — lesson-priority chỉ quyết định NEW word, không giới hạn distractors).
function makeQuizOpts(w, pool) {
  const all = pool;
  const confuseSet = getConfuseMap()[w.hz];
  const wTokens = viTokens(w.vi);
  // Chấm điểm mức độ "dễ nhầm" của mỗi từ so với từ đang hỏi:
  // 1) cùng nhóm dễ nhầm đã định nghĩa (hình dạng/âm giống nhau) > 2) trùng ký tự Hán
  // > 3) trùng từ khoá trong nghĩa (ngữ nghĩa giống nhau) > 4) cùng phân loại/bài học > 5) độ dài giống nhau
  const scored = all.filter(x => x.hz !== w.hz).map(x => {
    let s = 0;
    if (confuseSet && confuseSet.has(x.hz)) s += 12;
    const semSet = getSemanticMap()[w.hz];
    if (semSet && semSet.has(x.hz)) s += 8;
    for (const c of w.hz) { if (x.hz.includes(c)) s += 3; }
    const xTokens = viTokens(x.vi);
    s += xTokens.filter(t => wTokens.includes(t)).length * 4;
    if (w.cat && x.cat === w.cat) s += 3;
    if (x.l === w.l) s += 1;
    if (x.hz.length === w.hz.length) s += 0.5;
    return {x, s};
  });
  scored.sort((a,b) => b.s - a.s);
  // Các từ điểm rất cao (trùng nhóm dễ nhầm đã định nghĩa, hoặc trùng nhiều ký tự/nghĩa) luôn được ưu tiên chọn,
  // phần còn lại mới xáo trộn ngẫu nhiên để câu hỏi không lặp lại y hệt mỗi lần
  const mustInclude = scored.filter(p => p.s >= 8).slice(0, 3).map(p => p.x);
  const restPool = scored.filter(p => p.s < 8).slice(0, 12).map(p => p.x);
  let distractors = mustInclude.slice(0, 3);
  if (distractors.length < 3) {
    distractors = distractors.concat(shuffle(restPool).slice(0, 3 - distractors.length));
  }
  return shuffle([w, ...distractors]);
}
function rvMakeOpts(w) { return makeQuizOpts(w, WORDS.filter(x => isLoggedIn() || x.l <= GUEST_MAX_LESSON)); }

function qzRank(r) {
  if(r>=.9) return '🏆 Xuất sắc'; if(r>=.7) return '👍 Tốt'; if(r>=.5) return '📚 Cần ôn'; return '🔄 Học lại';
}

  if (lsQueue.totalPlanned === 0) {
    const msg = isLoggedIn()
      ? '🎉 Không còn thẻ nào đến hạn hoặc từ mới trong ngân sách hôm nay!<br><span style="font-size:.85rem;color:var(--muted)">Vào "🎯 Hôm nay học" để xem/chỉnh giới hạn.</span>'
      : 'Không có từ nào trong phạm vi bài đang chọn!';
    area.innerHTML = `<div class="panel center" style="padding:24px">${msg}</div>`; return;
  }
  if (lsQueue.items.length === 0) {
    area.innerHTML=`<div class="panel exam-result"><div class="exam-score">${lsScore}/${lsQueue.answeredCount}</div><div class="exam-rank">${qzRank(lsScore/lsQueue.answeredCount)}</div><button class="btn btn-primary" onclick="bindListen()">Làm lại</button></div>`;
    if (isLoggedIn()) refreshServerMeta(); // hết phiên — làm mới streak/known thật
    return;
  }
  lsRenderWord(lsQueue.items[0]);
  // auto-play
  setTimeout(()=>{
    const btn = document.getElementById('ls-play');
    if(btn) btn.click();
  }, 400);
}

function lsRenderWord(w) {
  const area = document.getElementById('ls-area');
  const pool = isLoggedIn() ? WORDS.filter(x=>x.hz!==w.hz) : getFilteredWords().filter(x=>x.hz!==w.hz);
  const distractors = shuffle(pool).slice(0,3);
  const opts = shuffle([w,...distractors]);
  const optHtml = opts.map(o=>`
    <button class="listen-opt" onclick="lsPickWord(this,'${o.hz}','${w.hz}')">${o.hz}${showPinyin?`<div style="font-size:.7rem;color:var(--muted)">${o.py}</div>`:''}${showHanViet && o.hanviet?`<div style="font-size:.68rem;color:var(--active-dark);font-weight:600">${o.hanviet}</div>`:''}</button>`).join('');
  area.innerHTML=`<div class="panel">
    <div style="font-size:.75rem;color:var(--muted);margin-bottom:10px">Câu ${lsQueue.answeredCount+1} · còn ${lsQueue.items.length} trong hàng đợi · Nghe và chọn chữ Hán đúng</div>
    <button id="ls-play" class="listen-play" onclick="speak('${w.hz}')" title="Phát lại">🔊</button>
    <div class="listen-opts">${optHtml}</div>
  </div>`;
  lsStartedAt = performance.now(); // Phần 4: đo từ thời điểm câu hỏi hiển thị (trước cả auto-play)
}

// V70/V71: trả lời đi qua ĐÚNG reviewService.reviewCard() (user đã đăng nhập). sqAdvance() đảm
// bảo thẻ vừa đúng bị loại khỏi phiên ngay, thẻ sai chỉ lặp lại sau tối thiểu REPEAT_GAP thẻ khác.
function lsPickWord(btn, chosen, correct) {
  const w = lsQueue.items[0];
  const isCorrectLocally = chosen === correct;
  const responseTimeMs = performance.now() - lsStartedAt;
  document.querySelectorAll('#ls-area .listen-opt').forEach(b=>{
    const bv = b.getAttribute('onclick').match(/'([^']+)','[^']+'/)[1];
    if(bv===correct) b.classList.add('correct');
    else if(b===btn && !isCorrectLocally) b.classList.add('wrong');
    b.disabled=true;
  });
  if(isCorrectLocally) playDing(); else playBuzz();
  (async () => {
    let isCorrect = isCorrectLocally;
    if (isLoggedIn()) {
      const data = await submitFsrsReview({ word: w, quizType: fsrsQuizTypeFor('listen'), selectedAnswer: chosen, responseTimeMs });
      if (data && data.ok) isCorrect = !!data.answerCorrect;
    } else {
      guestMarkActivity();
    }
    if (isCorrect) lsScore++;
    setTimeout(()=>{ sqAdvance(lsQueue, isCorrect); lsRenderQ(); }, 1400);
  })();
}

function renderStats() {
  const bookLabel = [...selectedBookIds].map(id=>BOOKS.find(b=>b.id===id).name).join(', ');
  const levelSelect = levelSelectHtml();
  const lessonSelect = lessonSelectHtml();

async function bindStats() {
  if (!isLoggedIn()) return; // đã hiện thông báo "cần đăng nhập" tĩnh ở renderStats()
  let statLessons = lessonsAllMode ? lessonsOfSelection() : [...selectedLessons].sort((a,b)=>a-b);
  const all = lessonsAllMode
    ? WORDS.filter(w => selectedBookIds.has(bookOfLesson(w.l)))
    : WORDS.filter(w => selectedLessons.has(w.l));

  try {
    const [knownRes, weakRes] = await Promise.all([
      statLessons.length
        ? fetch('/api/study/known-by-lesson?lessons=' + statLessons.join(','), { headers: authHeaders() }).then(r=>r.json())
        : Promise.resolve({ ok:true, known:{} }),
      fetch('/api/study/weak-words', { headers: authHeaders() }).then(r=>r.json()),
    ]);
    if (currentTab !== 'stats') return; // user đã rời tab trong lúc chờ tải

    const knownByLesson = (knownRes.ok && knownRes.known) || {};
    const totalKnown = Object.values(knownByLesson).reduce((s,n)=>s+n, 0);

    const statsArea = document.getElementById('stats-area');
    if (statsArea) statsArea.innerHTML = `
      <div class="stat-box"><div class="stat-num">🔥${getStreak()}</div><div class="stat-lbl">Ngày streak</div></div>
      <div class="stat-box"><div class="stat-num" style="color:var(--l8a)">⭐${totalKnown}</div><div class="stat-lbl">Từ đã thuộc</div></div>
      <div class="stat-box"><div class="stat-num">${all.length}</div><div class="stat-lbl">Tổng từ trong phạm vi</div></div>
    `;

    const barsEl = document.getElementById('stats-bars');
    if (barsEl) {
      const lessonsForBars = isLoggedIn() ? statLessons : statLessons.filter(l => l <= GUEST_MAX_LESSON);
      barsEl.innerHTML = lessonsForBars.map(l=>{
        const total = WORDS.filter(w=>w.l===l).length || 1;
        const known = knownByLesson[l] || 0;
        const pct = Math.round(known/total*100);
        return `<div class="bar-col">
          <div class="bar-pct" style="color:${lessonColor(l)}">${known}/${total}</div>
          <div class="bar-fill" style="height:${pct*.6}px;background:${lessonColor(l)}"></div>
          <div class="bar-lbl">B${l}</div>
        </div>`;
      }).join('');
    }

    const weakEl = document.getElementById('stats-weak');
    if (weakEl) {
      const scopeHz = new Set(all.map(w=>w.hz));
      const weak = ((weakRes.ok && weakRes.words) || []).filter(w => scopeHz.has(w.hz)).slice(0, 8);
      weakEl.innerHTML = weak.length ? weak.map(w=>`<div class="weak-item">
        <span class="weak-hz" style="color:${lessonColor(w.l)}">${w.hz}</span>
        <span class="weak-info">${w.vi}${showPinyin?` · ${w.py}`:''}${showHanViet && w.hanviet?` · ${w.hanviet}`:''} · ${w.lapses||0} lần quên</span>
        <button class="btn-sound-sm" onclick="speak('${w.hz}')">🔊</button>
      </div>`).join('') : '<div style="color:var(--muted);font-size:.9rem">Chưa có dữ liệu. Hãy bắt đầu học ở "🎯 Hôm nay học"!</div>';
    }
  } catch (e) {
    const statsArea = document.getElementById('stats-area');
    if (statsArea) statsArea.innerHTML = `<div class="stat-box" style="grid-column:1/-1">⚠️ Không tải được dữ liệu: ${e.message}</div>`;
  }
}
